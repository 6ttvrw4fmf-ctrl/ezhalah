# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Ezhalah house rules for CodeRabbit (owner 2026-11-06: «teach CodeRabbit our rules»).
# Each rule below caused a real production bug before; flag any change that breaks one as Major.
language: en-US
# Teach CodeRabbit HOW EZHALAH WORKS (owner 2026-11-07: «tell it how Ezhalah works»): it reads these as review guidelines.
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "docs/ops/EZHALAH_DATA_ARCHITECTURE_GOAL.md"
      - "docs/ops/ADVANCED_FILTER_SOURCE_TRUTH.md"
      - "docs/ADVANCED_FILTER_PRODUCT_CONTRACT.md"
      - "docs/ops/LISTING_LIVENESS.md"
      - "docs/ops/CAPTURED_FIELD_CLASSIFICATION.md"
  learnings:
    scope: auto
reviews:
  # chill (owner 2026-11-07, paid Essential): fewer nitpicks; Majors are still raised and engineers must fix or answer them.
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  auto_review:
    enabled: true
    drafts: false
    # Robot-made PRs with nothing to judge, skipped to save the plan's monthly reviews (overages are OFF).
    # A SKIPPED CodeRabbit never blocks a merge (scripts/lib/mergeGate.ts ADVISORY_MAY_SKIP).
    ignore_title_keywords:
      - "mirror (auto)"
      - "chore(deploy): record approved"
      # Owner 2026-11-09 («only send it the important fixes»): ~100 PRs/day from ONE author hit CodeRabbit's fair-use
      # floor (1 review/hour on every flat plan), so 60 of 97 PRs sat «rate limited» and blocked merges for hours.
      # A «mirror:» PR copies SQL production already ran (checked byte-exact by the database lane) — nothing to judge.
      - "mirror:"
  # Docs-only PRs are skipped. Scrapers are reviewed again (owner 2026-11-10: usage budget on, $0.25/file).
  path_filters:
    - "!docs/**"
  # Paid finishing touches: engineers ask «@coderabbitai generate unit tests» on every bug-fix PR, so each fix ships a test.
  finishing_touches:
    unit_tests:
      enabled: true
    docstrings:
      enabled: false
  tools:
    gitleaks:
      enabled: true
    ruff:
      enabled: true
    shellcheck:
      enabled: true
    actionlint:
      enabled: true
    eslint:
      enabled: true
  path_instructions:
    - path: "**/*"
      instructions: |
        Ezhalah is a neutral Saudi property search engine. Flag as MAJOR any change that:
        - Changes a price or rent period the source published (PRICE = SOURCE, PERIOD = SOURCE). Only our own
          parsing errors may be corrected, and derived figures (e.g. per-m² × area, monthly × 12) must be labelled.
        - Stores or logs a phone number, email or person name from a listing (PDPL). Redaction must be idempotent.
        - Recommends a property or says best / good deal / better (neutrality), or surfaces a source's own badges.
        - Lets Gathern or Aqar Monthly appear in Buy, or shows an off-plan project as a normal listing.
        - Treats a failed or partial fetch/crawl as «no results» or as proof an ad is gone.
        - Is a SYMPTOM-ONLY fix (owner 2026-11-07: 66 % of new alerts were the same bugs coming back): it repairs data
          rows, re-runs a job or widens a threshold WITHOUT changing the code/rule that produced the bug, or it ships
          no test/detector that would fail if the bug returned. Ask: «why did this happen, and what stops it next time?»
        - Hides or deactivates listings in bulk without a guard (collapse guard, 3 complete misses, or proof the ad page is gone).
    - path: "supabase/migrations/**"
      instructions: |
        - Every applied migration needs a byte-exact mirror (sql/mirrors/, cron changes in sql/mirrors/cron_schedule.json) in the same PR.
        - CREATE OR REPLACE of an existing function/view must start from the LIVE definition and change only the intended
          lines; a full replace silently drops a concurrent migration's edits.
        - Long rebuilds must `set local client_min_messages = warning` (the Management API drops at ~120 s).
        - RAISE strings must not contain an unescaped apostrophe.
        - Never GRANT internal/ops tables or views to anon/authenticated.
    - path: "scrapers/**"
      instructions: |
        - Honest UA, ≤ 1 request/second, obey robots.txt, and stop on any CAPTCHA/challenge (never bypass).
        - Store every field the source gives, including the full description.
        - A district comes from the site, then map pins (Apple, then Google), else city only; never guess.
        - Absence from a list alone is not proof an ad is gone when its own page can be checked.
        - Flag as MAJOR a catch/ignore of a write or network error that is not reported (Sentry reportError/reportMessage in src, a printed error + counter or mon_raise in scrapers). Clicks were refused for 5 months, unseen, 2026-11-07.
    - path: "src/**"
      instructions: |
        - A displayed count must equal the cards a user can reach.
        - A failed request must show an error/retry, never an empty «no results» state.
        - English UI mirrors the Arabic; the close ✕ sits top-right in both languages.
        - Flag as MAJOR a catch/ignore of a write or network error that is not reported (Sentry reportError/reportMessage in src, a printed error + counter or mon_raise in scrapers). Clicks were refused for 5 months, unseen, 2026-11-07.
    - path: ".github/workflows/**"
      instructions: |
        - Every job uses the shared EZ_RUNNER switch expression for runs-on (enforced by scripts/verify-runner-switch.ts).
        - Never print secrets; never add a schedule without updating the cron-ordering contract.
