name: Migration drift guard (production vs git)

# Owner-requested permanent barrier (2026-08-10): "Production DB change -> tracked migration ->
# repository matches production -> CI verifies the match. If another session changes production
# directly and forgets to commit it, I want our system to detect it immediately and fail loudly."
#
# scripts/safe-deploy.sh already refuses to DEPLOY on drift, but that only ever checks at the
# moment someone deploys. Concurrent agent sessions apply migrations directly to production via the
# Supabase MCP routinely (AGENTS.md "Deployment lock" documents this as expected, not a mistake) —
# a session that does this without also committing the SQL leaves drift that a push-triggered check
# alone would NEVER catch, because there may be no push at all. This workflow exists to close that
# exact gap: it runs independent of any git activity, on a tight schedule, so drift is caught within
# minutes of being introduced rather than at the next deploy attempt (which is how the 2026-07-16
# PGRST203 outage happened) or the next daily-engineer run (which is how it was actually caught on
# 2026-08-04 and 2026-08-10 — up to 24h later).
#
# scripts/verify-migration-drift-vs-production.ts also runs on every push/PR via `npm test`
# (full-verification-ci.yml) — this workflow is the complementary schedule-driven half, and the
# only one of the two with the service-role key, so ONLY this one also raises/resolves a P1 in
# alert_event (the same stream the ops dashboard and mon_run_all_detectors already watch) —
# turning drift into a paged alert, not just a GitHub Actions red X someone has to go looking for.
#
# Read-only against production except for that one alert_event write (via mon_raise/mon_resolve_key,
# both scoped exactly to that purpose — see their own grants/comments). Never touches migrations,
# never applies anything, never deploys anything.

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes — tight enough that "immediately" is actually true
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch: {}

concurrency:
  group: migration-drift-guard
  cancel-in-progress: true

jobs:
  drift-check:
    name: Verify production migrations match git
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify migration drift vs production
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node --experimental-strip-types --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/verify-migration-drift-vs-production.ts

      # Drift condition #5 (2026-08-30): conditions #1-#4 above compare only IDENTIFIERS - a
      # version, a name, a function signature - so a committed file can contain SQL production never
      # executed and every one of them stays green. This step compares the CONTENT. `if: always()`
      # is deliberate: the two conditions are independent, and an identifier-level drift must not
      # hide a content-level one behind an early exit.
      - name: Verify migration content parity vs production (drift condition #5)
        if: always()
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node --experimental-strip-types --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/verify-migration-content-parity.ts

      # P0 fast-lane membership (issue #1408, 2026-08-31). P0 detection was trapped inside job 38's
      # single transaction, invisible to the separate fast-lane session for up to 712s against a
      # 300s SLO; 20260831192229 moved it into the lane. That fix is a LIST of ten detector names,
      # and a list rots: add a detector that raises P0, wire it to the full-sweep roster only, and
      # it silently inherits the old latency with every other barrier still green. This step is the
      # only thing that would notice. It rides here rather than `npm test` for the same reason the
      # two steps above do - it reads production, and a P0 detector added in one PR must not fail
      # every unrelated PR. `if: always()` for the same independence reason.
      - name: Verify every P0-capable detector runs on the fast lane
        if: always()
        run: node --experimental-strip-types --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/verify-p0-fast-lane-detection.ts
