# Unified retention cleanup (scrapers/common/cleanup.py). MANUAL DISPATCH ONLY — no schedule, so it
# is dormant until deliberately run. Even when run it deletes NOTHING unless the platform's
# platform_retention_policy row has enabled=true (or --force) AND passes every guard (age, missing_count,
# anomaly cap, and a fresh source re-check confirming the listing is gone). Gradual rollout: enable one
# platform at a time by flipping its policy row, then dispatch with dry_run=true first to review the report.
name: Platform cleanup (retention)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform key (e.g. gathern, aqarcity, aqar, wasalt)"
        required: true
        type: string
      dry_run:
        description: "Probe + classify + report, delete nothing"
        type: boolean
        default: true
      force:
        description: "Run even if policy.enabled=false (all safety guards still apply)"
        type: boolean
        default: false

concurrency:
  group: platform-cleanup-${{ github.event.inputs.platform }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    # 180 min, matching wasalt-cleanup.yml: a wasalt dispatch drives a real browser per candidate
    # (~15-20s each), so a drain batch needs ~2.5h. 60 min cancelled wasalt-cleanup's first drain
    # dry-run mid-recheck (2026-09-20) — the same ceiling would do the same here.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: scrapers/requirements.txt
      - name: Install scraper dependencies
        run: pip install -r scrapers/requirements.txt
      # `platform` is a free-text input, so this entrypoint CAN be dispatched for wasalt — and
      # cleanup.py's re-check only reaches wasalt.sa through scrapers/wasalt/browser.py, which is
      # gated on WASALT_BROWSER. Without it every wasalt re-check falls back to the curl_cffi+proxy
      # shape wasalt null-routes (issue #1019), returns unknown after a 25s timeout, and the run's
      # inconclusive freeze trips: this workflow could never delete a single genuinely-dead wasalt
      # listing, while reporting a plausible run. Fails safe, but silently — the same shape as
      # ops_incident #704 on the auditing side. The dedicated wasalt-cleanup.yml has carried this
      # transport since the browser migration; the generic entrypoint had not.
      #
      # Adds no capability and moves no guard: identical code, identical policy row, identical
      # age/strike/anomaly/fraction gates and the same fresh per-row DIRECT re-check.
      - name: Install Chromium for the Cloudflare path
        run: python -m playwright install --with-deps chromium
      - name: Run cleanup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WASALT_PROXY_URL: ${{ secrets.WASALT_PROXY_URL }}
          WASALT_BROWSER: "1"
        run: |
          # headless=False clears the challenge; the runner has no display, so xvfb-run supplies one.
          exec xvfb-run -a python -m scrapers.common.cleanup \
            --platform "${{ github.event.inputs.platform }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }} \
            ${{ github.event.inputs.force == 'true' && '--force' || '' }}
