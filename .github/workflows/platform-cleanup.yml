# Unified retention cleanup (scrapers/common/cleanup.py). MANUAL DISPATCH ONLY — no schedule, so it
# is dormant until deliberately run. Even when run it deletes NOTHING unless the platform's
# platform_retention_policy row has enabled=true (or --force) AND passes every guard (age, missing_count,
# anomaly cap, and a fresh source re-check confirming the listing is gone). Gradual rollout: enable one
# platform at a time by flipping its policy row, then dispatch with dry_run=true first to review the report.
name: Platform cleanup (retention)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform key (e.g. gathern, aqarcity, aqar, wasalt)"
        required: true
        type: string
      dry_run:
        description: "Probe + classify + report, delete nothing"
        type: boolean
        default: true
      force:
        description: "Run even if policy.enabled=false (all safety guards still apply)"
        type: boolean
        default: false

concurrency:
  group: platform-cleanup-${{ github.event.inputs.platform }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: scrapers/requirements.txt
      - name: Install scraper dependencies
        run: pip install -r scrapers/requirements.txt
      - name: Run cleanup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WASALT_PROXY_URL: ${{ secrets.WASALT_PROXY_URL }}
        run: |
          python -m scrapers.common.cleanup \
            --platform "${{ github.event.inputs.platform }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }} \
            ${{ github.event.inputs.force == 'true' && '--force' || '' }}
