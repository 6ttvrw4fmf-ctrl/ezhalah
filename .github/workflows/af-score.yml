# Advanced Filter score — the 🔬 engineer's nightly computed rating (owner 2026-10-04). CI holds the service
# key the cloud engineer lacks. Samples production-ready listings first seen MORE than 24 h ago, re-reads each
# original ad (scrapers/common/af_score.py), asks the PUBLIC anon RPC for it the way a customer would, and writes
# one row per website into ops_af_score. Dispatch-only: pg_cron row gh-af-score calls
# trigger_gh_workflow('af-score.yml') at 08:00 UTC (01:00 Arizona), before the engineer wakes at 09:00 UTC.
# READ-ONLY on listings. Browser + display are for wasalt (cleanup._probe reaches wasalt only through
# scrapers/wasalt/browser.py — verify-wasalt-probing-workflows-carry-the-browser.ts).
name: AF score

on:
  workflow_dispatch:
    inputs:
      sites:
        description: "Only these websites, space-separated (empty = every website)"
        type: string
        default: ""
      per_site:
        description: "Pages opened per website (empty = 10 on a big website, 5 on a small one)"
        type: string
        default: ""
      dry_run:
        description: "Print the rows, write nothing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: af-score
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: scrapers/requirements.txt
      - name: Install scraper dependencies
        run: pip install -r scrapers/requirements.txt
      - name: Install Chromium for the Cloudflare path
        run: python -m playwright install --with-deps chromium
      - name: Compare older listings with their original pages and the customer path
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WASALT_PROXY_URL: ${{ secrets.WASALT_PROXY_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          WASALT_BROWSER: "1"
          SITES: ${{ inputs.sites }}
          PER_SITE: ${{ inputs.per_site }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          exec xvfb-run -a python -m scrapers.common.af_score \
            $([ "$DRY_RUN" = "true" ] && echo --dry-run) \
            $([ -n "$PER_SITE" ] && echo --per-site "$PER_SITE") \
            $([ -n "$SITES" ] && echo --sites $SITES)
