# Wasalt residential sweep — runs every 4h in the cloud through a Saudi residential proxy
# (DataImpulse). Mirrors Aqar's residential sweep: light 3-page pass over every type-slug ×
# sale+rent, one parallel matrix job per slice. The proxy makes wasalt.sa think the request
# is coming from a Saudi home IP, which is the only way the cloud reaches it.

name: Wasalt residential sweep

on:
  workflow_dispatch: {}

concurrency:
  group: wasalt-residential-sweep
  cancel-in-progress: true

jobs:
  sweep:
    name: Wasalt res ${{ matrix.slug }} ${{ matrix.deal }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # OWNER-APPROVED 2026-08-23 (proposed 08-21 as PR #827). All 20 jobs here share ONE
      # WASALT_PROXY_URL (DataImpulse Saudi-residential proxy) secret and previously dispatched
      # fully parallel with no cap. Worse, this sweep (jobid 4, `40 */8`) and the 14-job
      # commercial sweep (jobid 5, `45 */8`) fire FIVE MINUTES apart into SEPARATE concurrency
      # groups, so up to 34 concurrent sessions hit one proxy. That is wasalt's own
      # self-contention, and it is what the 2026-08-17 step change looks like: daily
      # scrape_runs failure went 0.0% (11 straight days) -> 57.8-69.1% and stayed there, with
      # failing runs plateauing at a near-constant 204.2-204.7s (a proxy connect timeout) while
      # runs in the SAME dispatch batch succeeded in 5.2-36.7s, randomly interleaved across
      # unrelated slugs — the signature of a shared resource, not a per-content block.
      #
      # 6 here + 6 in the commercial sweep caps the realistic peak at 12 instead of 34. It is a
      # deliberately conservative starting value: this repo has no visibility into the DataImpulse
      # plan's actual concurrent-session limit, so tune it up if the sweep cadence suffers, or
      # down if failures persist. mon_detect_proxy_contention() now watches that directly.
      #
      # SCOPE NOTE (2026-08-23, measured — do not widen this without re-measuring): this is a
      # WASALT fix. souq24 also reuses WASALT_PROXY_URL, but it does NOT overlap these sweeps:
      # souq24 runs ~04:38-06:52 while wasalt's proxy work lands at 00:40/00:45, 03:15-03:19,
      # 08:40/08:45, 16:40/16:45 and 21:01. souq24's own failure is a separate, still-open
      # defect (see mon_detect_run_duration_explosion / docs) and must not be attributed here.
      max-parallel: 6
      matrix:
        slug: [apartment, villa-townhouse, floor, building, land, rest-house, chalet, farm, room, duplex]
        deal: [sale, rent]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: scrapers/requirements.txt
      - name: Install scraper dependencies
        run: pip install -r scrapers/requirements.txt
      # Cloudflare path (issue #1019): wasalt.sa cannot be read by any http client any
      # more, so this sweep drives a real Chromium. --with-deps pulls the system
      # libraries Chromium needs on the runner image.
      - name: Install Chromium for the Cloudflare path
        run: python -m playwright install --with-deps chromium
      - name: Sweep ${{ matrix.slug }} ${{ matrix.deal }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # BROWSER + PROXY. Measured 2026-09-18, in this order:
          #   headed Chromium, laptop IP, no proxy   -> 200, challenge cleared, 32 listings
          #   headed Chromium, RUNNER IP, no proxy   -> 403, challenge NEVER clears (29KB shell)
          # So a real browser is necessary but not sufficient: Cloudflare also judges the IP, and a
          # GitHub datacenter IP is refused however real the browser is. That is the same two-factor
          # shape issue #1019 found, with the factors now being (IP reputation) x (JS execution)
          # rather than (IP) x (TLS fingerprint).
          #
          # Real-browser + residential-proxy is the ONE cell #1019 never tested — it tried
          # plain-TLS+proxy, chrome124+proxy, no-impersonate+proxy and chrome124+direct, all of
          # which either 403 or hang. The browser supplies the JS execution the challenge demands
          # and the proxy supplies the residential IP it demands.
          WASALT_PROXY_URL: ${{ secrets.WASALT_PROXY_URL }}
          WASALT_BROWSER: "1"
          SCRAPE_MIN_INTERVAL: "0.4"
        run: |
          # headless=False is what clears the Cloudflare challenge (headless is detected
          # and never clears — measured 2026-09-18). The runner has no display, so the
          # browser needs a virtual one; xvfb-run supplies it.
          exec xvfb-run -a python -m scrapers.wasalt.run \
            --type residential \
            --slug ${{ matrix.slug }} \
            --deal ${{ matrix.deal }} \
            --pages 3
