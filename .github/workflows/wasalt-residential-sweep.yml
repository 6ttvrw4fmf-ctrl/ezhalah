# Wasalt residential sweep — runs every 4h in the cloud through a Saudi residential proxy
# (Webshare). Mirrors Aqar's residential sweep: light 3-page pass over every type-slug ×
# sale+rent, one parallel matrix job per slice. The proxy makes wasalt.sa think the request
# is coming from a Saudi home IP, which is the only way the cloud reaches it.

name: Wasalt residential sweep

on:
  workflow_dispatch: {}

concurrency:
  group: wasalt-residential-sweep
  cancel-in-progress: true

jobs:
  sweep:
    name: Wasalt res ${{ matrix.slug }} ${{ matrix.deal }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # PROPOSED 2026-08-21 (Approval Needed — see PR body): all 20 jobs share ONE
      # WASALT_PROXY_URL (Webshare Saudi-residential proxy) secret and previously dispatched
      # fully parallel with no cap, which measurably exceeded the proxy's concurrent-route
      # capacity (evidence: PR body / scrape_runs timing signature, 2026-08-17 through 08-21
      # step-change, ~58-68% failure rate). Mirrors the existing max-parallel: 18 pattern in
      # small-sources-sync.yml for a comparable multi-source matrix. 6 is a conservative
      # starting point picked without visibility into the actual Webshare plan's concurrent-
      # session limit — the owner may need to tune this once real production behavior is
      # observed against the account's real capacity.
      max-parallel: 6
      matrix:
        slug: [apartment, villa-townhouse, floor, building, land, rest-house, chalet, farm, room, duplex]
        deal: [sale, rent]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: scrapers/requirements.txt
      - name: Install scraper dependencies
        run: pip install -r scrapers/requirements.txt
      - name: Sweep ${{ matrix.slug }} ${{ matrix.deal }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WASALT_PROXY_URL: ${{ secrets.WASALT_PROXY_URL }}
          SCRAPE_MIN_INTERVAL: "0.4"
        run: |
          exec python -m scrapers.wasalt.run \
            --type residential \
            --slug ${{ matrix.slug }} \
            --deal ${{ matrix.deal }} \
            --pages 3
