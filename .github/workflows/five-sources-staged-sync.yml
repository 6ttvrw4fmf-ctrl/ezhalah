# The five sources of 2026-11-05, STAGED (owner order; the owner launches them himself — docs/ops/FIVE_SOURCES_LAUNCH.md):
# Keller Williams, Almajdiah rentals, Asas Makeen, Al Rajhi Development, STeam Residence. Each crawler reads only its
# site's own complete list with our honest bot user-agent (scrapers/common/honest_fetch.py: ≤ 1 request a second, no
# impersonation, no proxy; any 401/403/429/503/CAPTCHA stops that site's run) and upserts into <site>_*_listings
# (+ asasmakeen_offplan_units). Those tables are NOT wired into search and the registry rows are 'retired', so nothing
# this writes reaches a customer.
#
# NO SCHEDULE while staged: dispatched by hand. The launch moves each site to small-sources-sync.yml's daily matrix
# (the liveness tier «own full list = the check» needs a complete read every day) and deletes this file.
#
#   gh workflow run five-sources-staged-sync.yml --ref main                       # all five
#   gh workflow run five-sources-staged-sync.yml --ref main -f source=mrajhi,steam
name: Five sources staged sync

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Comma list of sites (blank = all five)"
        type: string
        default: ""
      dry_run:
        description: "Walk + map, write nothing"
        type: boolean
        default: false

concurrency:
  group: five-sources-staged-sync
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Secret handshake (docs/ops/SCRAPE_GUARD.md): sent only to our own database and front door. Empty on forks = unchanged.
  EZ_GATE_SECRET: ${{ secrets.EZ_GATE_SECRET }}

jobs:
  sync:
    runs-on: ${{ (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && vars.EZ_RUNNER) || 'ubuntu-latest' }}
    # asasmakeen: ~560 pages at ≥ 1.1 s ≈ 11 minutes; the others are under 2 minutes.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { site: kellerwilliams, cmd: "python -m scrapers.kellerwilliams.run" }
          - { site: almajdiah,      cmd: "python -m scrapers.almajdiah.run" }
          - { site: asasmakeen,     cmd: "python -m scrapers.asasmakeen.run" }
          - { site: steam,          cmd: "python -m scrapers.steam.run" }
    steps:
      - name: Selected?
        id: pick
        env:
          WANT: ${{ github.event.inputs.source }}
          SITE: ${{ matrix.site }}
        run: |
          if [ -z "$WANT" ] || printf ',%s,' "$WANT" | tr -d ' ' | grep -q ",$SITE,"; then echo "run=1" >> "$GITHUB_OUTPUT"; else echo "skip $SITE"; fi
      - uses: actions/checkout@v4
        if: steps.pick.outputs.run == '1'
      - uses: actions/setup-python@v5
        if: steps.pick.outputs.run == '1'
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: scrapers/requirements.txt
      - name: Install scraper dependencies
        if: steps.pick.outputs.run == '1'
        run: pip install -r scrapers/requirements.txt pytest
      - name: Tests (price/period = source, PDPL, off-plan hidden, honest client)
        if: steps.pick.outputs.run == '1'
        run: python -m pytest -q scrapers/common/tests/test_five_sources_staged_ingest.py
      - name: Sync ${{ matrix.site }} (staged)
        if: steps.pick.outputs.run == '1'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY: ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
          CMD: ${{ matrix.cmd }}
        run: exec $CMD $DRY
