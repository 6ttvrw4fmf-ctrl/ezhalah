# Muktamel liveness ADJUDICATION — read-only evidence gathering, never a data pipeline.
#
# WHY THIS EXISTS: this repo's agent/sandbox environments get `curl (7) CONNECT tunnel failed,
# response 403` from muktamel.com, so no session running there can obtain a source verdict about a
# muktamel listing. CI can reach the host. `docs/ops/LISTING_LIVENESS.md` §9.4 states the rule this
# workflow exists to honour: an "EGRESS BLOCKED" note is a fact about the container that wrote it,
# never about the platform — re-measure from the egress the job really uses.
#
# WHAT IT ANSWERS that the production crawl's own canary cannot: muktamel's in-run canary validates
# the removal oracle only against ids the same run read LIVE, which proves the oracle does not cry
# death over a live page but never that it can RECOGNISE a dead one. This job takes both cohorts, so
# a run reports BOTH error rates — misses on the dead cohort, and false positives on the live
# controls, which is the direction that costs users real listings.
#
# It writes NOTHING to any database — no Supabase secret is needed or granted. The output is the CI
# log. Acting on a verdict (restore, void tainted strikes per ops_liveness_tainted_strike_void, or
# keep inactive) is a separate, evidenced step taken deliberately after reading it.
#
# Intentionally NOT on a schedule: dispatch by hand when adjudicating a real inactivation cohort.

name: Muktamel liveness adjudication

on:
  workflow_dispatch:
    inputs:
      dead_ids:
        description: "Comma-separated ids believed REMOVED (the cohort under audit)"
        required: true
      live_ids:
        description: "Comma-separated ids known SERVED — positive controls. Required: without them a 'gone' verdict cannot be told apart from the source refusing this egress."
        required: true

jobs:
  adjudicate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: scrapers/requirements.txt
      - name: Install scraper dependencies
        run: pip install -r scrapers/requirements.txt
      - name: Adjudicate against the shipped oracle
        run: |
          exec python -m scrapers.muktamel.adjudicate_killed \
            --dead-ids "${{ github.event.inputs.dead_ids }}" \
            --live-ids "${{ github.event.inputs.live_ids }}"
