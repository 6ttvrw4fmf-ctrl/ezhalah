# Gathern liveness sweep — detail-page 404 check that ages delisted units out of search (soft
# inactivation: active=false, row kept + resurrection-safe). Complements gathern-cleanup.yml, which
# HARD-deletes only after 30 days + 404.
#
# WHY a dedicated pass (not prune / mark_stale): Gathern has no other working inactivation path.
# prune_unseen is never called (the crawl only runs sharded, every shard skips prune); mark_stale
# can't fire (coverage gate needs one run to see >=50% of the catalog, which the sharded monthly crawl
# never does); and last_seen_at staleness is NOT a valid delisting signal — a fully-booked LIVE unit
# drops out of the has_available feed and goes stale just like a delisted one. Only the detail page
# tells them apart (404/410 = gone, 200 = live). See scrapers/gathern/liveness.py.
#
# AUTOMATIC (owner-authorized 2026-08-10) — daily apply at 06:00 UTC. Every safety rule is PERMANENT and
# unchanged; automation only removes the "remember to run it manually" gap:
#   • SOURCE-CONFIRMED ONLY — inactivates only on a real 404/410 from the unit's own gathern page.
#   • 200 = ALIVE — resets strikes + refreshes last_seen (rescues live-but-booked units).
#   • TRANSIENT (429/5xx/timeout/no-response) NEVER counts as dead — the row is left untouched.
#   • 3-STRIKE grace — a unit must 404 on THREE separate DAILY runs before active=false; the first
#     run after a clean history kills nothing. (Daily cadence => the July-2026 776-kill scare, which
#     needed 3 apply runs within ONE HOUR, is structurally impossible.)
#   • ANOMALY CAP — a kill batch above max(150, 2% of active) is QUARANTINED: strikes recorded, 0 rows
#     flipped, run marked ok=false for review. A partial / blocked / site-wide-404 crawl can NOT
#     mass-inactivate. (Guarded by scrapers/common/tests/test_gathern_liveness.py.)
#   • SINGLE RUNNER at ~1 req/s — Gathern 429s above ~2 req/s across ALL IPs; never a shard matrix.
#   • RESURRECTION stays possible — a killed row is pinned at missing_count=grace so the guarded
#     auto_recover can't revive it, but a genuine return to the feed reactivates it via the crawl upsert.
# A manual workflow_dispatch still defaults to DRY-RUN (apply=false) for ad-hoc inspection.

name: Gathern liveness

on:
  schedule:
    - cron: "0 6 * * *"   # daily 06:00 UTC — automatic source-confirmed apply (owner 2026-08-10)
  workflow_dispatch:
    inputs:
      apply:
        description: "Actually write missing_count / active=false (false = dry-run report only). Scheduled runs always apply."
        type: boolean
        default: false
      limit:
        description: "Max oldest-stale rows to probe this run (0 = all stale)"
        # 1500 sized so a run COMPLETES within timeout-minutes even at gathern's worst observed detail-
        # page throughput (~0.15 req/s under heavy 429 backoff, measured 2026-08-10): 1500/0.15 ≈ 2.8h
        # < 300m. A run that times out mid-loop never reaches the kill gate → 0 inactivations, so an
        # oversized limit would mean the automation strikes forever but never removes anything.
        default: "1500"
      min_stale_days:
        description: "Only probe rows not seen in the feed for this many days"
        default: "3"
      kill_cap:
        # EMPTY by default = the auto cap, max(150, 2% of currently-active). The owner released the
        # 150 hold on 2026-08-17 (DIE #26). Leaving a "150" default here is what silently re-applied
        # the hold on the first post-release dispatch even though the command no longer hardcodes it:
        # a default on the INPUT is just as binding as a default in the command.
        description: "Max rows one run may inactivate. Leave EMPTY for the auto cap max(150, 2% of active). Set a number only for a deliberate, reviewed override."
        default: ""
      grace:
        description: "Consecutive 404 sweeps before a unit is marked inactive"
        default: "3"
      proxy:
        # OWNER-AUTHORISED 2026-09-03, for gathern liveness only. gathern began answering our
        # datacenter/CI egress with its own application 404 page, which a 404-means-dead oracle
        # cannot tell from a real delisting: 302 rows inactivated 09-01, 106 on 09-02, and a
        # datacenter probe returned 404 on 12/12 rows the oracle had verified alive that morning.
        #
        # DISPATCH-ONLY BY DESIGN, exactly as dealapp's is (docs/ops/LISTING_LIVENESS.md §5.2).
        # The schedule does NOT set it, so the daily sweep's proxy bandwidth stays zero and the
        # shared metered pool gains no permanent consumer. A scheduled run on blocked egress now
        # canary-quarantines instead of striking, which is safe but does not VERIFY anything —
        # attaching this to the schedule is a capacity decision for the owner, not a code change.
        description: "Route probes through the shared Saudi residential proxy (WASALT_PROXY_URL). Reports as gathern_liveness_proxy so proxy contention counts it."
        type: boolean
        default: false
      canaries:
        description: "Known-alive control listings to probe BEFORE the worklist. If they fail, the whole run is quarantined (0 strikes, 0 inactivations). 0 disables (not recommended)."
        default: "10"
      recheck_dead:
        # RESURRECTION PASS (2026-08-22, Data Integrity run #37). Re-probes rows this sweep already
        # killed and RESTORES any the source still serves. Measured that day: 3 of 60 randomly
        # sampled killed rows returned a full HTTP 200 page (replicated 5/5 each) against a 10/10
        # live control -- ~5% of a 2,515-row cohort a user can no longer find. The pass can ONLY
        # restore: it never inactivates, never raises missing_count, and needs no kill cap.
        # DISPATCH-ONLY BY DESIGN: the daily 06:00 schedule keeps doing exactly what it did before,
        # so turning this on can never change the automatic sweep's behaviour.
        description: "Re-probe previously-killed rows and restore any the source still serves (dispatch only; ignored on the schedule)"
        type: boolean
        default: false

concurrency:
  group: gathern-liveness
  cancel-in-progress: false   # never interrupt a sweep mid-run

jobs:
  liveness:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: scrapers/requirements.txt
      - name: Install scraper dependencies
        run: pip install -r scrapers/requirements.txt
      - name: Gathern liveness sweep (${{ (github.event_name == 'schedule' || inputs.apply) && 'APPLY' || 'dry-run' }})
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPE_MIN_INTERVAL: "1.0"
          # Present but INERT unless --proxy is passed: scrapers/gathern/liveness.py reads this
          # ONLY behind the flag. The standing rule for this secret (scrapers/jazwtn/run.py) is
          # that it is metered, provisioned for wasalt, and must never be inherited silently.
          WASALT_PROXY_URL: ${{ secrets.WASALT_PROXY_URL }}
          PROXY_FLAG: ${{ (github.event_name != 'schedule' && inputs.proxy) && '--proxy' || '' }}
          # ONE source of truth for apply-vs-dry-run, used by BOTH the step name above and the flag
          # below. They used to be two different expressions -- the name tested `inputs.apply`
          # (truthy) while the flag tested `inputs.apply == 'true'`. Because the input is declared
          # `type: boolean`, that string comparison is ALWAYS false, so a dispatch with apply=true
          # rendered a step literally titled "APPLY" and then ran a DRY-RUN. Observed 2026-08-17:
          # `DRY-RUN scanned=1500 dead=676 WOULD inactivate=314`. A run that mislabels itself is
          # worse than one that fails, because the log reads like the work happened.
          APPLY_FLAG: ${{ (github.event_name == 'schedule' || inputs.apply) && '--apply' || '' }}
        run: |
          # ── HOLD RELEASED 2026-08-17 by the owner (DIE run #26). History kept deliberately. ──
          # Until 2026-08-16 the auto cap silently resolved to its 150 floor because the denominator
          # was read with head=True (.count = 0 on supabase==2.10.0). Run #24 fixed that and then
          # PINNED the cap at 150 via --kill-cap, because letting the corrected cap take effect
          # would action a 172-row backlog in one batch -- a bulk listing operation, and an owner
          # decision under the AGENTS.md RED list. The hold was correct: it kept behaviour identical
          # while the decision was pending, and made the cap an explicit logged choice rather than
          # an accident.
          #
          # The owner released it on 2026-08-17. By then the backlog had grown 172 -> 229 and those
          # rows were still production_ready, i.e. real users could click a listing gathern no longer
          # serves. Evidence re-taken at release, NOT inherited from run #24: 6/6 kill candidates
          # returned 404 against a control group of 6 currently-active rows that returned 200/307,
          # so the marker still discriminates and the deaths are real.
          #
          # NOTHING ELSE IS LOOSENED. Removing --kill-cap does not disable the anomaly gate; it
          # restores the gate to its DESIGNED value, max(150, 2% of currently-active) = ~590 at
          # 29.5k active. A batch above that still quarantines and still inactivates nothing. Per-row
          # source re-verification, the 3-strike grace, min-stale-days and the deletion path are all
          # untouched. Do NOT add a --kill-cap override back without a fresh owner decision; the run
          # notes print `kill_cap=N [auto=max(150,2% of NNNNN)]` so a silent regression stays visible
          # and mon_detect_liveness_cap_degraded() reads that marker.
          exec python -m scrapers.gathern.liveness \
            --limit ${{ inputs.limit || '1500' }} \
            --min-stale-days ${{ inputs.min_stale_days || '3' }} \
            --grace ${{ inputs.grace || '3' }} \
            --canaries ${{ inputs.canaries || '10' }} \
            ${{ inputs.kill_cap && format('--kill-cap {0}', inputs.kill_cap) || '' }} \
            ${{ (github.event_name != 'schedule' && inputs.recheck_dead) && '--recheck-dead' || '' }} \
            $PROXY_FLAG $APPLY_FLAG
