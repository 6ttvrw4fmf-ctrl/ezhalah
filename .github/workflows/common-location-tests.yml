# Shared location-resolver + placeholder-guard unit tests (2026-07-10 architecture redesign).
# Hermetic: no network, no secrets, ~1s runtime. This is the CODE-level guard (item 6, part 1) —
# it fails the build if the resolver's never-guess logic or the DB-write placeholder guard ever
# regresses. See scripts/check_placeholder_locations.py + .github/workflows/location-monitor.yml
# for the LIVE-DATA guard (item 6, part 2) that catches an actual placeholder reaching production.
name: Common location tests

on:
  push:
    paths:
      # Whole scrapers/ tree, deliberately. The suite reaches OUTSIDE scrapers/common: it imports
      # aqar/enrich_residential.py + fursaghyr/run.py, and the no-derivation guard reads
      # jazwtn|raghdan|fursaghyr|muktamel/run.py. Enumerating those paths is how the aqar goldens
      # ended up running on ZERO PRs touching the very file they guard (found 2026-07-26); the
      # enumeration would rot again on the next scraper added. The suite is hermetic and ~1s, so
      # running it on any scraper change is strictly cheaper than maintaining the list.
      - "scrapers/**"
      - ".github/workflows/common-location-tests.yml"
  pull_request:
    paths:
      # Whole scrapers/ tree, deliberately. The suite reaches OUTSIDE scrapers/common: it imports
      # aqar/enrich_residential.py + fursaghyr/run.py, and the no-derivation guard reads
      # jazwtn|raghdan|fursaghyr|muktamel/run.py. Enumerating those paths is how the aqar goldens
      # ended up running on ZERO PRs touching the very file they guard (found 2026-07-26); the
      # enumeration would rot again on the next scraper added. The suite is hermetic and ~1s, so
      # running it on any scraper change is strictly cheaper than maintaining the list.
      - "scrapers/**"
      - ".github/workflows/common-location-tests.yml"
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pytest + scraper deps
        # scrapers/common/tests import real scraper modules (db.py→dotenv/supabase,
        # deal/run.py→curl_cffi), so the runtime deps must be present or pytest aborts on
        # collection. Installs the pinned scraper requirements + pytest. (2026-07-13 CI fix.)
        run: pip install pytest -r scrapers/requirements.txt
      - name: Run shared location-resolver + placeholder-guard + price-fidelity tests
        run: python -m pytest scrapers/common/tests/ -v
      - name: Run the per-scraper source-fidelity barriers
        # The 20 scrapers/<platform>/test_*.py files are assert-at-IMPORT scripts, not pytest
        # test_ functions, and they are written to own their interpreter: every one of them
        # stubs scrapers.common.db into sys.modules, and several rebind a shared helper
        # (`_al.to_catalog = lambda city_ar: ...`) with MUTUALLY INCOMPATIBLE signatures.
        # That is harmless one-file-per-process and poisonous in a shared process, so widening
        # the pytest target above to `scrapers/` is not an option: measured 2026-09-14, it turns
        # 1599 passing tests into 27 collection errors — AUTHORITATIVE_NULL disappearing into an
        # empty stub module, and `to_catalog() got an unexpected keyword argument region_hint`
        # once abwbna's 1-arg lambda has overwritten the real function for alhoshan/aqargate.
        # (pytest would also report `no tests ran` for these files, since they define no test_ fn.)
        # So: one file, one interpreter — exactly how they are run by hand. Globbed, never
        # enumerated, for the same reason the path filters above are not enumerated: a list rots,
        # and a barrier nobody runs is how awal/test_parked_source.py sat broken from the day it
        # was written (ModuleNotFoundError: no sys.path bootstrap) until 2026-09-14.
        run: |
          rc=0; n=0
          for f in scrapers/*/test_*.py; do
            n=$((n + 1))
            echo "── $f"
            python "$f" || { echo "::error file=$f::barrier FAILED"; rc=1; }
          done
          [ "$n" -gt 0 ] || { echo "::error::glob matched no barriers — the suite silently ran nothing"; rc=1; }
          echo "ran $n per-scraper barriers"
          exit $rc
