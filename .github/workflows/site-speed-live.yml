# Site speed watch (owner 2026-10-27: «I don't want my website to be slow or freeze … fix it if anything goes wrong
# immediately»). Every 30 minutes and after each production deploy: one real visitor journey on a mid-range phone —
# open ezhalah.com, search Riyadh, tap a golden listing — against per-step budgets. A red run raises an alert
# (alert_event → GitHub issue via alert-dispatch.yml) for the engineers to fix. Read-only; uses the robot pass.
# Logic: e2e/speed/site-speed-live.mjs (wiring pinned by scripts/verify-site-speed-watch-wired.ts).
# STARTED BY pg_cron (2026-11-05): GitHub ran the schedule below only ~3 times a day, so the bundles at :12 and :43
# trigger this workflow (migration 20261105172415); the GitHub cron stays as a backup.
name: Site speed watch (live)

on:
  schedule:
    - cron: '9,39 * * * *'
  workflow_run:
    workflows: ['Ad viewer speed — live guard'] # after-deploy robots run in turn: Deploy → Guardian → Selector → Ad viewer → this
    types: [completed]
  workflow_dispatch: {}

concurrency:
  group: site-speed-live
  cancel-in-progress: false

env:
  EZ_GATE_SECRET: ${{ secrets.EZ_GATE_SECRET }}

jobs:
  speed:
    name: Phone journey — open, search, tap within budget
    runs-on: ${{ (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && vars.EZ_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 15
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'workflow_run' && github.event.workflow_run.conclusion != 'skipped')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright + browser
        run: |
          npm i -D @playwright/test@^1.49
          # apt behind «--with-deps» flaked on 2026-11-11 (exit 100); three tries, a mirror blip never fails a run.
          ok=0; for i in 1 2; do timeout 240 npx playwright install --with-deps chromium && { ok=1; break; }; echo "playwright install --with-deps failed or hung on apt (try $i)"; sleep 15; done
          # 2026-11-11 15:0x: three tries still failed (the apt mirror of the runner image was down) — the Ubuntu runner image already
          # carries the browser libraries, so the browser itself is installed without apt and the run goes on; a missing lib fails the launch, visibly.
          [ "$ok" = 1 ] || { echo "apt still failing — installing the browser without --with-deps"; npx playwright install chromium; }
      - name: Open, search and tap on a mid-range phone
        env:
          BASE_URL: https://ezhalah.com
        run: node e2e/speed/site-speed-live.mjs
      # Owner 2026-11-08 (iPhone on a VPN: the signed-in sidebar and a saved chat «take sooooo long to load and pop»):
      # the guest journey above never opened ☰ or a saved chat. Runs even when the guest journey is red, so both verdicts
      # reach the bridge below in one run. Logic: e2e/speed/signed-in-sidebar-live.mjs.
      - name: Signed-in sidebar and a saved chat on the same phone, 4G and a VPN line
        if: always()
        env:
          BASE_URL: https://ezhalah.com
        run: node e2e/speed/signed-in-sidebar-live.mjs

      # Unattended: a red run must reach a human. One open alert per workflow file; the next green run resolves it.
      - name: Bridge this run's result to alert_event
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: >-
          node scripts/ops/raise-workflow-alert.mjs
          --kind journey_live_check_failed
          --workflow site-speed-live.yml
          --status ${{ job.status }}
          --run-url ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
