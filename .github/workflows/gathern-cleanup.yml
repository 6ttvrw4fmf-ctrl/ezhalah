# Weekly gathern retention cleanup via the unified engine (scrapers/common/cleanup.py). Honors the
# gathern platform_retention_policy row (enabled + 30-day + cap + anomaly). Deletes a unit ONLY after
# re-fetching its real gathern URL and getting a hard 404; a live/booked 200 is never deleted (self-
# healed). Triggered weekly by pg_cron (gh-gathern-cleanup); dispatchable manually for a dry-run.
name: Gathern cleanup

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = probe + classify + report, delete NOTHING (use this before any first real run)"
        required: false
        # MUST default to "false": the weekly pg_cron trigger (gh-gathern-cleanup) dispatches with
        # NO inputs, so the default is what the scheduled job gets. Defaulting to "true" here would
        # silently turn the real weekly cleanup into a no-op.
        default: "false"

concurrency:
  group: gathern-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: scrapers/requirements.txt
      - name: Install scraper dependencies
        run: pip install -r scrapers/requirements.txt
      - name: Run gathern cleanup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          exec python -m scrapers.common.cleanup --platform gathern \
            ${{ inputs.dry_run == 'true' && '--dry-run' || '' }}
