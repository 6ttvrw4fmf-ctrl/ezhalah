# Post-delete spot-check (barrier 11, owner-directed safety audit 2026-08-22): re-probes a sample
# of recently hard-deleted listings per platform and confirms the source agrees they are actually
# gone. Independent second opinion against scrapers/common/cleanup.py's own recheck — see
# scrapers/common/verify_deletions.py's module docstring for why this matters even though the
# delete step already rechecks each row once.
#
# Runs weekly, staggered AFTER the four cleanup workflows so there is something fresh to sample
# (gathern 03:00 UTC, aqarcity 03:30, aqar 02:00, wasalt 02:30 -> this runs 05:00). Any 'live'
# finding raises a P0 via mon_detect_deleted_but_source_live; it never restores anything itself.
name: Verify deletions (post-delete spot-check)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Single platform to check (leave empty to check all 4 enabled platforms)"
        required: false
        type: string
      sample:
        description: "Max rows to re-probe per platform"
        required: false
        default: "40"
      days:
        description: "Lookback window over cleanup_deletion_log, in days"
        required: false
        default: "30"

concurrency:
  group: verify-deletions
  cancel-in-progress: false

jobs:
  verify:
    name: Verify ${{ matrix.platform }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Every platform currently registered in scrapers/common/cleanup.py's PLATFORMS dict — keep
        # this list in sync with that dict when a new platform is added to the engine.
        platform: [aqar, wasalt, gathern, aqarcity]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: scrapers/requirements.txt
      - name: Install scraper dependencies
        run: pip install -r scrapers/requirements.txt
      - name: Run verification
        if: ${{ github.event.inputs.platform == '' || github.event.inputs.platform == matrix.platform }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WASALT_PROXY_URL: ${{ secrets.WASALT_PROXY_URL }}
        run: |
          exec python -m scrapers.common.verify_deletions \
            --platform "${{ matrix.platform }}" \
            --sample "${{ github.event.inputs.sample || '40' }}" \
            --days "${{ github.event.inputs.days || '30' }}"
