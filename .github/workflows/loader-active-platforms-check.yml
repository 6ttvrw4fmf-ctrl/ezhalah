# Loader roster must equal production's active-searchable platform set (owner rule 2026-08-29).
#
# The search-loading strip advertises one logo per platform Ezhalah currently searches. If a scraper
# goes cold with zero reachable rows in `search_listings_ar`, its logo must not appear in the
# strip — dishonest to users, unfair to the platform. The client filters at runtime via
# `loader_active_platforms_ar()`. This job is the STATIC HALF: it queries production (anon REST)
# and asserts `PLATFORM_META`, mapped through `SOURCE_TOKENS`, equals the current active set — so
# the static list cannot silently drift from reality.
#
# Read-only (anon key, RLS-respecting) — never the service role. Excluded from `npm test` because
# `npm test` is a required status check on every PR; wiring a live check there would fail unrelated
# PRs whenever production momentarily disagreed with the shipped catalog.

on:
  schedule:
    - cron: '29 */6 * * *' # every 6h, offset from the other live checks
  workflow_dispatch:

concurrency:
  group: loader-active-platforms-check
  cancel-in-progress: false

jobs:
  loader-active-set:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PLATFORM_META must equal production active-searchable set
        run: node --experimental-strip-types --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/verify-loader-platforms-match-active.ts

      # Same subject — a platform must not be represented as more than it is — and the same anon
      # read, so it shares this job rather than earning a workflow of its own. `if: always()` so a
      # red roster check does not hide an unearned liveness claim.
      - name: No platform is represented as liveness-proven without the evidence
        if: always()
        run: node --experimental-strip-types --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/verify-liveness-claims-are-earned.ts

      # Third face of the same subject: a platform must not be represented as more than it is, and
      # it must not serve users from OUTSIDE the set the detectors read. muktamel sat at
      # status='dormant' while serving 523 production_ready rows, so mon_detect_silent_scraper_death
      # skipped it entirely (senior production run 2026-09-05). Same anon read, so it shares this
      # job. `if: always()` so an earlier red check cannot hide an unwatched live platform.
      - name: Every production-searchable platform is inside the monitored registry
        if: always()
        run: node --experimental-strip-types --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/verify-searchable-platforms-are-monitored.ts

      # ── The three per-platform COVERAGE reads (ops_incident #104, 2026-09-06) ───────────────────
      # Each of these was the LIVE half of a barrier that also carried a hermetic predicate. The
      # predicates and their mutation proofs stay in the required `npm test`; these three can only be
      # answered by asking production, so they belong here — same subject as the checks above (a
      # platform must not be represented as more than it is), same anon read, so they share this job.
      # They landed here rather than staying in `npm test` because a fact about production's roster
      # was deciding the required status check on unrelated diffs: one of them flipped RED/GREEN/RED
      # on a single unchanged commit, and another went red because a platform went live mid-PR.
      # `if: always()` so an earlier red cannot hide a coverage gap.
      #
      # NOTE FOR WHOEVER TOUCHES THESE LINES: each offline half asserts, via liveHalfProblems(),
      # that THIS FILE actually invokes its live sibling. Renaming or removing a step below turns the
      # matching offline barrier RED in `npm test` — which is the point. A split must not be able to
      # decay into a deletion.
      - name: Every searchable platform is in BOTH Advanced Filter attribute views
        if: always()
        run: node --experimental-strip-types --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/verify-af-attribute-views-cover-every-platform-live.ts

      - name: Every searchable platform has arms in listing_location_index
        if: always()
        run: node --experimental-strip-types --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/verify-location-index-covers-every-searchable-platform-live.ts

      - name: Every searchable platform is visible to the image-coverage monitor
        if: ${{ !cancelled() }}
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}
        run: node --experimental-strip-types --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/verify-active-platform-image-coverage-not-blind.ts

      - name: Image coverage holds its floors and no platform is live undeclared
        if: always()
        run: node --experimental-strip-types --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/verify-image-coverage-ratchet-live.ts

      # ── Failure→alert bridge (2026-09-04, issue #1349) ──────────────────────────────────────────
      # This job runs unattended: a red run notifies nobody, so it has to reach alert_event to reach
      # a human. One open P1 per workflow file (dedup workflow_failed:loader-active-platforms-check.yml), and the next
      # green run resolves it. `always()` so a failing run still gets here.
      - name: Bridge this run's result to alert_event
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: >-
          node scripts/ops/raise-workflow-alert.mjs
          --kind journey_live_check_failed
          --workflow loader-active-platforms-check.yml
          --status ${{ job.status }}
          --run-url ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
