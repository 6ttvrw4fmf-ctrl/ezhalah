# Alert delivery — the missing last mile of the barrier system (2026-08-11).
#
# mon_run_all_detectors() raises alert_event rows twice an hour, and mon_dispatch_alerts() has
# carried delivery plumbing since launch — but with 0 webhook channels configured it has been a
# complete no-op: 56 unresolved alerts existed with dispatched_at NULL and nobody had ever been
# told. A barrier that detects a serious problem nobody receives is incomplete protection.
#
# This workflow is the delivery channel, built ONLY from credentials the repo already holds
# (SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY as Actions secrets, plus the built-in GITHUB_TOKEN):
# every undispatched unresolved P0/P1/P2 alert becomes ONE GitHub issue per dedup_key, and the
# issue auto-closes when the alert resolves in the database. No new secrets, no paid service.
#
# P0 WAS MISSING FROM THAT FILTER UNTIL 2026-08-26, and it cost 41 days of silence.
# The filter read `severity=in.(P1,P2)`. P0 is more severe than P1, not less -- but it was not in
# the list, so it was never selected. Measured when this was found: 53 P0 alerts raised since
# 2026-07-16, every one of kind silent_scraper_death ("a scraper has stopped capturing"),
# dispatched = 0. Not one reached a human through this channel; the ones that got looked at were
# hand-filed by a daily-engineer run that happened to read the table. The only P0-adjacent thing
# this workflow ever filed was the P2 meta-alert `unresolvable_alert_kind:silent_scraper_death` --
# the alert ABOUT the alert was delivered while the P0 itself was not.
#
# The severity set now lives canonically in scripts/lib/alertDelivery.ts (DELIVERED_SEVERITIES)
# and is mirrored by public.mon_detect_alert_delivery(); scripts/verify-alert-delivery-coverage.ts
# (in `npm test`) fails if this filter, that file and that detector ever disagree again.
# P3 stays excluded deliberately -- it is informational -- and the detector excludes it in step,
# so undelivered P3 rows do not raise.
#
# Semantics (mirrors mon_dispatch_alerts' fail-closed design):
#   - dispatched_at is stamped per-row ONLY after the gh call succeeds, so a mid-loop failure
#     leaves the remainder undispatched for the next run.
#   - The issue title "[alert] <dedup_key>" IS the identity — do not rename issues.
#   - Every issue is labelled with the daily engineer routine that OWNS it (`routine-N-...`), per
#     docs/ops/ALERT_ROUTING.md. Routing is total: an unmatched kind goes to routine #2, the
#     standing triage router, never to nobody. Added 2026-08-28 — until then delivery worked and
#     ownership did not, and 18 open P1s sat unacknowledged with nobody named on them.
#   - Closing an issue by hand does NOT resolve the alert; a persisting condition re-raises and
#     files a fresh issue. Resolution lives in the database (mon_resolve_key / detector self-heal).
#   - mon_dispatch_alerts() stays untouched and remains a no-op while 0 webhook channels exist;
#     if a webhook channel is ever configured, dispatched_at becomes ambiguous between the two
#     consumers and needs a dedicated column FIRST (documented owner decision, not needed today).
#
# Schedule: :09/:39 — 10 minutes after the :29/:59 detector sweep, off the :00/:15/:20 hot slots
# (cron-discipline rule from the 2026-08-10 outage; GitHub-side, kept consistent deliberately).
#
# A FILED ISSUE IS NOT THE SAME AS A HUMAN HAVING SEEN IT (2026-08-26, same-day follow-up to the
# P0 blackout above). alert_event has carried an `acknowledged_at` column since the schema was
# introduced, but nothing ever wrote to it -- checked when this was found: 28 open P0/P1 alerts,
# all already dispatched (an issue exists for each), zero acknowledged, oldest since 2026-08-11.
# The "Acknowledge alerts..." step below closes that loop the same no-new-secrets way as the rest
# of this file: a human assigning themselves to the GitHub issue IS the acknowledgment signal, and
# this step mirrors it back into acknowledged_at. public.mon_detect_unacknowledged_p0() pages again
# (a fresh P1) if a P0 sits dispatched-but-unassigned past a 4-hour grace window -- see
# scripts/verify-alert-acknowledgment-coverage.ts (npm test).
name: Alert dispatch (P0/P1/P2 -> GitHub issues)

on:
  schedule:
    - cron: "9,39 * * * *"
  workflow_dispatch: {}

concurrency:
  group: alert-dispatch
  cancel-in-progress: true

permissions:
  issues: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      # Needed by the routing step below, which EXECUTES scripts/lib/alertRouting.ts rather than
      # restating its table here. No `npm ci` — the routing lib has no dependencies, and installing
      # the app's toolchain just to print a label would put the delivery channel behind the
      # dependency graph of the thing it is supposed to report on.
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Ensure labels exist (idempotent)
        run: |
          set -euo pipefail
          gh label create ezhalah-alert --repo "$REPO" --force --color D93F0B --description "Auto-filed from alert_event by alert-dispatch.yml" >/dev/null
          # One label per daily engineer routine. Generated from scripts/lib/alertRouting.ts so a
          # routine renamed there cannot leave the label it routes to uncreated -- which would make
          # `gh issue edit --add-label` fail and the issue stay unowned.
          node --experimental-strip-types --disable-warning=MODULE_TYPELESS_PACKAGE_JSON \
            -e 'import("./scripts/lib/alertRouting.ts").then(m=>console.log(m.ALERT_ROUTINE_LABELS.join("\n")))' \
            | while read -r l; do
              gh label create "$l" --repo "$REPO" --force --color 1D76DB --description "Owning daily engineer routine (docs/ops/ALERT_ROUTING.md)" >/dev/null
            done
          # P0 must exist or `gh issue create --label P0` fails and the row is never stamped.
          gh label create P0 --repo "$REPO" --force --color 5319E7 --description "Highest-severity production alert" >/dev/null
          gh label create P1 --repo "$REPO" --force --color B60205 --description "Critical production alert" >/dev/null
          gh label create P2 --repo "$REPO" --force --color FBCA04 --description "Important production alert" >/dev/null

      - name: File issues for undispatched alerts
        run: |
          set -euo pipefail
          # Severity set is canonical in scripts/lib/alertDelivery.ts DELIVERED_SEVERITIES and is
          # pinned against this line by scripts/verify-alert-delivery-coverage.ts. %28/%29 are the
          # URL-encoded parens PostgREST's in.() filter needs inside this interpolated URL.
          rows=$(curl -sf "$SUPABASE_URL/rest/v1/alert_event?select=id,severity,kind,platform,dedup_key,detail,created_at&resolved_at=is.null&dispatched_at=is.null&severity=in.%28P0,P1,P2%29&order=severity.asc,created_at.asc&limit=100" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          n=$(jq length <<<"$rows")
          echo "undispatched P0/P1/P2 alerts: $n"
          [ "$n" -eq 0 ] && exit 0

          gh issue list --repo "$REPO" --label ezhalah-alert --state open --limit 200 --json number,title > open_issues.json

          echo "$rows" | jq -c '.[]' | while read -r row; do
            id=$(jq -r .id <<<"$row")
            sev=$(jq -r .severity <<<"$row")
            kind=$(jq -r .kind <<<"$row")
            platform=$(jq -r '.platform // "-"' <<<"$row")
            dedup=$(jq -r .dedup_key <<<"$row")
            created=$(jq -r .created_at <<<"$row")
            title="[alert] ${dedup}"

            {
              echo "**${sev}** | kind: \`${kind}\` | platform: \`${platform}\` | raised: ${created} | alert_event id: ${id}"
              echo
              echo '```json'
              jq .detail <<<"$row"
              echo '```'
              echo
              echo "_Auto-filed by alert-dispatch.yml. This issue auto-closes when the alert resolves in alert_event (detector self-heal or mon_resolve_key). Do not rename the title — it is the dedup identity. Closing by hand does not resolve the alert; a persisting condition will re-raise._"
            } > body.md

            existing=$(jq -r --arg t "$title" '.[] | select(.title == $t) | .number' open_issues.json | head -1)
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --repo "$REPO" --body-file body.md
              echo "commented #${existing} for ${dedup}"
            else
              gh issue create --repo "$REPO" --title "$title" --label ezhalah-alert --label "$sev" --body-file body.md
              echo "created issue for ${dedup}"
            fi

            # Stamp ONLY after gh succeeded (set -e aborts before reaching here on failure).
            curl -sf -X PATCH "$SUPABASE_URL/rest/v1/alert_event?id=eq.${id}&dispatched_at=is.null" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
              -H "Content-Type: application/json" -H "Prefer: return=minimal" \
              -d "{\"dispatched_at\":\"$(date -u +%FT%TZ)\"}"
          done

      - name: Route each alert issue to its owning engineer routine
        run: |
          set -euo pipefail
          # DELIVERED IS NOT OWNED. Measured 2026-08-28, after delivery itself had been working for
          # two days: 55 open `[alert]` issues, every one carrying only `ezhalah-alert` + a severity
          # label, and 18 open P1s with acknowledged_at still NULL, oldest since 2026-08-11. An
          # issue with no owner is the same silence as an alert with no channel, one step later.
          #
          # Deliberately a SEPARATE, IDEMPOTENT sweep rather than a `--label` on the create call:
          #   * it backfills every issue filed before routing existed, with no migration;
          #   * it self-heals an issue whose label a human removed, or one filed by a run that died
          #     between `gh issue create` and here;
          #   * it is one mechanism instead of two, so there is no create-path/backfill-path skew.
          # Only issues with NO routine-* label are touched, so a human re-routing an issue by hand
          # is respected and never fought over on the next tick.
          gh issue list --repo "$REPO" --label ezhalah-alert --state open --limit 200 --json number,title,labels \
            | jq -c '.[] | select(([.labels[].name] | map(startswith("routine-")) | any) | not)' | while read -r issue; do
            num=$(jq -r .number <<<"$issue")
            dedup=$(jq -r '.title | sub("^\\[alert\\] "; "")' <<<"$issue")
            enc=$(jq -rn --arg s "$dedup" '$s|@uri')
            # Route on the alert's KIND, not its dedup_key: the key carries the instance (platform,
            # id, table) while the kind is what names the failing surface, and ownership is a
            # property of the surface.
            kind=$(curl -sf "$SUPABASE_URL/rest/v1/alert_event?select=kind&dedup_key=eq.${enc}&order=created_at.desc&limit=1" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY" | jq -r '.[0].kind // empty')
            # An issue can outlive its row (hard-deleted alert_event, hand-filed issue). Fall back to
            # the title text so it still gets AN owner. Never `continue` here: skipping is precisely
            # how an alert ends up owned by nobody, and routineForKind() is total — worst case it
            # lands on routine #2, which holds the triage mandate.
            if [ -z "$kind" ]; then kind="$dedup"; fi
            label=$(node --experimental-strip-types --disable-warning=MODULE_TYPELESS_PACKAGE_JSON \
              scripts/alert-routing-label.ts "$kind")
            gh issue edit "$num" --repo "$REPO" --add-label "$label"
            echo "routed #${num} (${kind}) -> ${label}"
          done

      - name: Close issues whose alerts resolved
        run: |
          set -euo pipefail
          gh issue list --repo "$REPO" --label ezhalah-alert --state open --limit 200 --json number,title \
            | jq -c '.[]' | while read -r issue; do
            num=$(jq -r .number <<<"$issue")
            dedup=$(jq -r '.title | sub("^\\[alert\\] "; "")' <<<"$issue")
            enc=$(jq -rn --arg s "$dedup" '$s|@uri')
            unresolved=$(curl -sf "$SUPABASE_URL/rest/v1/alert_event?select=id&dedup_key=eq.${enc}&resolved_at=is.null&limit=1" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY" | jq length)
            if [ "$unresolved" -eq 0 ]; then
              gh issue close "$num" --repo "$REPO" --comment "Resolved in alert_event: no unresolved rows remain for this dedup_key."
              echo "closed #${num} (${dedup})"
            fi
          done

      - name: Acknowledge alerts whose issue has an assignee
        run: |
          set -euo pipefail
          # A human assigning themselves to the issue IS the acknowledgment signal -- simpler and
          # more robust than parsing comment authorship for "was this a bot or a person". Only
          # PATCHes rows still acknowledged_at IS NULL, so this is safe to run every cycle.
          gh issue list --repo "$REPO" --label ezhalah-alert --state open --limit 200 --json number,title,assignees \
            | jq -c '.[] | select((.assignees | length) > 0)' | while read -r issue; do
            dedup=$(jq -r '.title | sub("^\\[alert\\] "; "")' <<<"$issue")
            enc=$(jq -rn --arg s "$dedup" '$s|@uri')
            curl -sf -X PATCH "$SUPABASE_URL/rest/v1/alert_event?dedup_key=eq.${enc}&resolved_at=is.null&acknowledged_at=is.null" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
              -H "Content-Type: application/json" -H "Prefer: return=minimal" \
              -d "{\"acknowledged_at\":\"$(date -u +%FT%TZ)\"}"
            echo "acknowledged ${dedup}"
          done
