name: Aqar land usage repair

# Re-reads live Aqar plots typed by the pre-2026-10-10 page-text guess (every plot commercial /
# industrial / agricultural, 0 residential) — and plots left untyped — through the production enricher +
# upsert (scrapers/aqar/recover_stubs.py --cohort land-usage), so each takes Aqar's OWN «نوع العقار»:
# سكني → Residential Land · تجاري and سكني/تجاري → Commercial Land; Aqar silent → the seller's own
# adjacent words («أرض صناعي»); neither → «أرض» (Other Land).
# A failed fetch writes nothing (the enricher returns None, the upsert drops it); a re-read row's
# raw_captured_at moves past `before`, so it is never picked twice.
#
# Started once by hand with `before` = the fix's merge time; each round re-dispatches the next until
# ≤100 rows are left.

on:
  workflow_dispatch:
    inputs:
      before:
        description: "ISO time — re-read live plots whose capture is older than this (the fix's merge time)"
        required: true
      limit:
        description: "rows per shard this run (5 shards)"
        required: false
        default: "6000"
      hops:
        description: "rounds this run may still chain after itself"
        required: false
        default: "4"

concurrency:
  group: aqar-land-usage-repair
  cancel-in-progress: false

env:
  # Secret handshake (docs/ops/SCRAPE_GUARD.md): scripts/lib/gateFetch.mjs and robotPass.mjs send it only to our own
  # database and front door, so our robots keep working once the back door closes. Empty on fork PRs = unchanged.
  EZ_GATE_SECRET: ${{ secrets.EZ_GATE_SECRET }}

jobs:
  repair:
    runs-on: ${{ (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && vars.EZ_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]      # one machine (own IP) per shard; ≤2.5 fetches/s each
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: scrapers/requirements.txt
      - name: Install scraper dependencies
        run: pip install -r scrapers/requirements.txt
      - name: Repair land usage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPE_MIN_INTERVAL: "0.4"
          BEFORE: ${{ inputs.before }}
        run: |
          exec python -m scrapers.aqar.recover_stubs --cohort land-usage --before "$BEFORE" \
            --shard ${{ matrix.shard }}/5 --limit "${{ inputs.limit || '6000' }}" --table residential

  next:
    needs: repair
    if: ${{ needs.repair.result == 'success' && (inputs.hops || '4') != '0' }}
    runs-on: ${{ (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && vars.EZ_RUNNER) || 'ubuntu-latest' }}
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: scrapers/requirements.txt
      - name: Install scraper dependencies
        run: pip install -r scrapers/requirements.txt
      - name: Dispatch the next round while plots still need it
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ inputs.before }}
        run: |
          left=$(python -c "import os; from scrapers.aqar.recover_stubs import remaining_land_guesses; print(remaining_land_guesses(os.environ['BEFORE']))")
          echo "live Aqar plots not yet re-read: $left"
          if [ "$left" -gt 100 ]; then
            gh workflow run aqar-land-usage-repair.yml --ref "${{ github.ref_name }}" -f before="$BEFORE" \
              -f limit="${{ inputs.limit || '6000' }}" -f hops="$(( ${{ inputs.hops || '4' }} - 1 ))"
          fi
