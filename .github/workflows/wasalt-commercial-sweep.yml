# Wasalt commercial sweep — runs every 4h in the cloud through the Saudi residential proxy.
# Mirrors Aqar's commercial sweep. Wasalt has thinner commercial inventory; light pass is plenty.

name: Wasalt commercial sweep

on:
  workflow_dispatch: {}

concurrency:
  group: wasalt-commercial-sweep
  cancel-in-progress: true

jobs:
  sweep:
    name: Wasalt com ${{ matrix.slug }} ${{ matrix.deal }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # OWNER-APPROVED 2026-08-23 (proposed 08-21 as PR #827). Same shared-proxy capacity
      # rationale as wasalt-residential-sweep.yml — see the full note there. This sweep fires
      # five minutes after the residential one into a SEPARATE concurrency group, so the two
      # overlap by design; capping BOTH at 6 is what actually bounds the peak (12, not 34).
      # Changing this value without changing the residential cap leaves the peak unbounded.
      max-parallel: 6
      matrix:
        slug: [shop, office, warehouse, commercial-land, showroom, building, land]
        deal: [sale, rent]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: scrapers/requirements.txt
      - name: Install scraper dependencies
        run: pip install -r scrapers/requirements.txt
      # Cloudflare path (issue #1019): wasalt.sa cannot be read by any http client any
      # more, so this sweep drives a real Chromium. --with-deps pulls the system
      # libraries Chromium needs on the runner image.
      - name: Install Chromium for the Cloudflare path
        run: python -m playwright install --with-deps chromium
      - name: Sweep ${{ matrix.slug }} ${{ matrix.deal }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # BROWSER + PROXY. Measured 2026-09-18, in this order:
          #   headed Chromium, laptop IP, no proxy   -> 200, challenge cleared, 32 listings
          #   headed Chromium, RUNNER IP, no proxy   -> 403, challenge NEVER clears (29KB shell)
          # So a real browser is necessary but not sufficient: Cloudflare also judges the IP, and a
          # GitHub datacenter IP is refused however real the browser is. That is the same two-factor
          # shape issue #1019 found, with the factors now being (IP reputation) x (JS execution)
          # rather than (IP) x (TLS fingerprint).
          #
          # Real-browser + residential-proxy is the ONE cell #1019 never tested — it tried
          # plain-TLS+proxy, chrome124+proxy, no-impersonate+proxy and chrome124+direct, all of
          # which either 403 or hang. The browser supplies the JS execution the challenge demands
          # and the proxy supplies the residential IP it demands.
          WASALT_PROXY_URL: ${{ secrets.WASALT_PROXY_URL }}
          WASALT_BROWSER: "1"
          SCRAPE_MIN_INTERVAL: "0.4"
        run: |
          # headless=False is what clears the Cloudflare challenge (headless is detected
          # and never clears — measured 2026-09-18). The runner has no display, so the
          # browser needs a virtual one; xvfb-run supplies it.
          exec xvfb-run -a python -m scrapers.wasalt.run \
            --type commercial \
            --slug ${{ matrix.slug }} \
            --deal ${{ matrix.deal }} \
            --pages 3
