# Copy the front-door handshake secret from GitHub into the Vercel project env (owner 2026-10-21: "better in the cloud",
# no copy-paste through a laptop). Reads the EZ_GATE_SECRET repository secret and upserts it as the Production env var
# EZ_GATE_SECRET of the canonical project ezhalah-app (the same ids the deploy target guard pins). The value never
# appears in a log, a file or a chat. It DEPLOYS NOTHING: the variable takes effect on the next deploy through
# deploy-frontend.yml (the safe-deploy script). Dispatch-only. docs/ops/SCRAPE_GUARD.md.
name: Vercel gate secret

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  # Secret handshake (docs/ops/SCRAPE_GUARD.md): scripts/lib/gateFetch.mjs and robotPass.mjs send it only to our own
  # database and front door, so our robots keep working once the back door closes. Empty on fork PRs = unchanged.
  EZ_GATE_SECRET: ${{ secrets.EZ_GATE_SECRET }}

jobs:
  set-env:
    name: Upsert EZ_GATE_SECRET into Vercel Production env
    runs-on: ${{ (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && vars.EZ_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 3
    steps:
      - name: Upsert env var
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          EZ_GATE_SECRET: ${{ secrets.EZ_GATE_SECRET }}
          PROJECT_ID: prj_CLp9BxNzT4RmWL9Is1KjHoQlSAlX
          TEAM_ID: team_0lVrGRoJbCRIWovPNkfnmwJ7
        run: |
          set -euo pipefail
          if [ "${#EZ_GATE_SECRET}" -lt 32 ]; then echo "EZ_GATE_SECRET is missing or too short"; exit 1; fi
          body=$(jq -n --arg v "$EZ_GATE_SECRET" '{key: "EZ_GATE_SECRET", value: $v, type: "sensitive", target: ["production", "preview"]}')
          code=$(curl -s -o /tmp/out -w '%{http_code}' -X POST \
            "https://api.vercel.com/v10/projects/$PROJECT_ID/env?teamId=$TEAM_ID&upsert=true" \
            -H "Authorization: Bearer $VERCEL_TOKEN" -H 'content-type: application/json' --data "$body")
          if [ "$code" != "200" ] && [ "$code" != "201" ]; then
            echo "Vercel env upsert failed: HTTP $code"; jq -r '.error.message // .error.code // "no detail"' /tmp/out 2>/dev/null || true; exit 1
          fi
          echo "EZ_GATE_SECRET saved in Vercel Production env (length ${#EZ_GATE_SECRET}). Takes effect on the next deploy."
