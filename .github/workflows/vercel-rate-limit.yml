# VERCEL RATE LIMIT (owner 2026-11-04: «only let people go at normal human speed», watch mode first).
# One per-IP rule on the database front door (/sb/* and /api/sb*) in the Vercel firewall. It deploys nothing: it upserts
# the rule through the Vercel API and reads the ACTIVE config back to prove it took. Modes:
#   log        = watch only: over-limit requests are logged in the Firewall overview, nobody is refused (start here)
#   rate_limit = refuse over-limit requests with 429 (owner OK 2026-11-12). Our own robots reach ~595 front-door calls/min,
#                so the rule skips a request carrying x-ezhalah-ratepass = sha256(EZ_GATE_SECRET:speed-limit-pass), which
#                scripts/lib/robotPassCore.mjs sends (scripts/verify-speed-limit-robot-pass.ts pins both sides)
#   off        = keep the rule but switch it off
# Threshold (measured 2026-11-02/04 in edge_logs): the busiest real visitor made 128 calls/min, p99 91; 300/min/IP is
# ~2.3x that. Saudi mobile carriers share addresses (CGNAT), so read the log-mode hits before ever refusing anyone.
# docs/ops/SCRAPE_GUARD.md «Speed limit».
name: Vercel rate limit

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'log = watch only, rate_limit = refuse with 429, off = disable'
        required: true
        type: choice
        options: ['log', 'rate_limit', 'off']

permissions:
  contents: read

env:
  # Secret handshake (docs/ops/SCRAPE_GUARD.md): every workflow carries it (verify-gate-handshake.ts). Unused here.
  EZ_GATE_SECRET: ${{ secrets.EZ_GATE_SECRET }}

jobs:
  set-rule:
    name: Set front-door rate limit to ${{ inputs.mode }}
    runs-on: ${{ (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && vars.EZ_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 3
    steps:
      - name: Upsert the rule, then read back the active config
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          MODE: ${{ inputs.mode }}
          PROJECT_ID: prj_CLp9BxNzT4RmWL9Is1KjHoQlSAlX
          TEAM_ID: team_0lVrGRoJbCRIWovPNkfnmwJ7
        run: |
          set -euo pipefail
          case "$MODE" in log|rate_limit|off) ;; *) echo "refusing unknown mode"; exit 1 ;; esac
          [ -n "$VERCEL_TOKEN" ] || { echo "VERCEL_TOKEN secret is missing"; exit 1; }
          # Our robots' speed-limit pass (owner 2026-11-12): a one-way hash of the gate secret, the same value
          # scripts/lib/robotPassCore.mjs ratePass() sends as x-ezhalah-ratepass. Never the secret itself.
          [ -n "$EZ_GATE_SECRET" ] || { echo "EZ_GATE_SECRET secret is missing — refusing a speed limit our robots cannot pass"; exit 1; }
          PASS=$(printf '%s' "$EZ_GATE_SECRET:speed-limit-pass" | sha256sum | cut -d' ' -f1)
          API=https://api.vercel.com/v1/security/firewall/config
          Q="projectId=$PROJECT_ID&teamId=$TEAM_ID"
          NAME=ezhalah-front-door-speed-limit
          AUTH=(-H "Authorization: Bearer $VERCEL_TOKEN" -H 'content-type: application/json')
          ACT=$([ "$MODE" = off ] && echo log || echo "$MODE")
          ON=$([ "$MODE" = off ] && echo false || echo true)
          # A project that never had a firewall rule has no active config yet: Vercel answers 404 (measured on the first
          # run, 2026-11-04). That is "no rules", not an error; anything else non-200 stops here.
          read_active() {
            code=$(curl -sS -o fw.json -w '%{http_code}' "${AUTH[@]}" "$API/active?$Q")
            case "$code" in
              200) cat fw.json ;;
              404) echo '{}' ;;
              *) echo "reading the active firewall config failed: HTTP $code — $(head -c 300 fw.json)" >&2; return 1 ;;
            esac
          }
          current=$(read_active)
          id=$(jq -r --arg n "$NAME" '[.rules[]? | select(.name == $n) | .id][0] // ""' <<<"$current")
          rule=$(jq -n --arg n "$NAME" --arg a "$ACT" --argjson on "$ON" --arg pass "$PASS" '{
            name: $n, active: $on,
            description: "Per-IP speed limit on the database front door. docs/ops/SCRAPE_GUARD.md",
            conditionGroup: [
              {conditions: [{type: "path", op: "pre", value: "/sb/"},
                            {type: "header", key: "x-ezhalah-ratepass", op: "eq", value: $pass, neg: true}]},
              {conditions: [{type: "path", op: "pre", value: "/api/sb"},
                            {type: "header", key: "x-ezhalah-ratepass", op: "eq", value: $pass, neg: true}]}
            ],
            action: {mitigate: {action: "rate_limit", actionDuration: null,
              rateLimit: {algo: "fixed_window", window: 60, limit: 300, keys: ["ip"], action: $a}}}
          }')
          body=$(jq -n --arg id "$id" --argjson v "$rule" 'if $id == "" then {action: "rules.insert", id: null, value: $v} else {action: "rules.update", id: $id, value: $v} end')
          echo "$( [ -z "$id" ] && echo inserting || echo updating ) $NAME → active=$ON action=$ACT"
          code=$(curl -sS -o patch.json -w '%{http_code}' -X PATCH "${AUTH[@]}" "$API?$Q" --data "$body")
          case "$code" in 2??) echo "PATCH accepted (HTTP $code)" ;; *) echo "PATCH refused: HTTP $code — $(head -c 400 patch.json)"; exit 1 ;; esac
          after=$(read_active)
          if jq -e --arg n "$NAME" --arg a "$ACT" --argjson on "$ON" '.rules[]? | select(.name == $n and .active == $on and .action.mitigate.rateLimit.action == $a and ([.conditionGroup[]?.conditions[]? | select(.type == "header" and .key == "x-ezhalah-ratepass" and .neg == true)] | length) == 2)' <<<"$after" >/dev/null; then
            echo "✓ the ACTIVE firewall config has $NAME with active=$ON, action=$ACT (60 s window, 300 per IP; our robots' pass skips it)."
          else
            echo "✗ the change did not appear in the ACTIVE config (it may be a draft, or the token lacks firewall scope)."
            echo "  rules now in the active config: $(jq -c '[.rules[]? | {name, active}]' <<<"$after")"
            echo "  PATCH answered: $(head -c 400 patch.json)"
            exit 1
          fi
