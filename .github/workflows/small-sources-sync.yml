# Small sources sync — ONE daily workflow for ALL the small, low-churn Saudi platforms (Aldarim,
# Aqar Gate, Hajer, Al Hoshan, Sanadak, …). Replaces the per-platform sync workflows.
#
# Why: these sites are small (tens–hundreds of listings) and low-churn, so they don't need the 4h
# cadence the big sources (Aqar, Wasalt) get — daily is plenty. And ONE established daily cron fires
# reliably, where many separate brand-new 4h crons get skipped by GitHub's scheduler.
#
# Add a new small platform = add ONE line to the matrix below: its name + the command that scrapes
# both its verticals in one run. That's it.

name: Small sources sync

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Source slug(s) to run, comma-separated (blank = all)"
        required: false
        default: ""

concurrency:
  group: small-sources-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Per-source override via matrix.tmo — souq24's ~1.3k-GET sweep through the metered Saudi proxy
    # sometimes needs >90m (killed at exactly 90:16 on 07-03 AND 07-04, marking those RUNS
    # "cancelled"). Default stays 90 for everyone else (covers aqarcity ~2.3k Cloudflare pages).
    # (Restored 2026-07-16 — PR #77 accidentally flattened this back to a fixed 90.)
    timeout-minutes: ${{ matrix.tmo || 90 }}
    strategy:
      fail-fast: false    # one source failing never blocks the others
      max-parallel: 18
      matrix:
        include:
          - { source: aldarim,  cmd: "python -m scrapers.aldarim.run --pages 50" }
          - { source: aqargate, cmd: "python -m scrapers.aqargate.run --type all" }
          - { source: hajer,    cmd: "python -m scrapers.hajer.run --type all" }
          - { source: alhoshan, cmd: "python -m scrapers.alhoshan.run --type all" }
          - { source: sanadak,  cmd: "python -m scrapers.sanadak.run --type all" }
          - { source: eastabha, cmd: "python -m scrapers.eastabha.run --type all" }
          - { source: aqarcity, cmd: "python -m scrapers.aqarcity.run --type all" }
          - { source: raghdan,    cmd: "python -m scrapers.raghdan.run --type all" }
          - { source: eaqartabuk, cmd: "python -m scrapers.eaqartabuk.run --type all" }
          - { source: satel,      cmd: "python -m scrapers.satel.run --type all" }
          - { source: sadin,      cmd: "python -m scrapers.sadin.run --type all" }
          - { source: mustqr,      cmd: "python -m scrapers.mustqr.run --type all" }
          - { source: ramzalqasim, cmd: "python -m scrapers.ramzalqasim.run --type all" }
          - { source: fursaghyr,   cmd: "python -m scrapers.fursaghyr.run --type all" }
          - { source: mizlaj,      cmd: "python -m scrapers.mizlaj.run --type all" }
          - { source: aqaratikom,  cmd: "python -m scrapers.aqaratikom.run --type all" }
          # awal — RE-ADDED 2026-09-04 (owner-instructed), satisfying this line's own precondition:
          # "Do not re-add without confirming the domain serves real listings again." Confirmed live
          # 2026-09-04: /wp-json/wp/v2/rtcl_listing returns HTTP 200 with x-wp-total: 128 (the
          # parking stub is gone), and the SHIPPED scraper parses all 128 into rows with 128
          # DISTINCT ad_numbers / listing_urls / descriptions — real inventory, no duplication.
          # Two source facts recorded so neither is mistaken for a bug later: the newest listing is
          # 2026-02-14 (real but LOW-CHURN, so a run returning the same 128 is healthy), and the
          # source publishes NO price at all (0/128 in the REST payload AND the detail pages) —
          # nothing is inferred to fill it, exactly like the 7,534 priceless rows already live.
          - { source: awal,        cmd: "python -m scrapers.awal.run --type all" }
          - { source: alkhaas,     cmd: "python -m scrapers.alkhaas.run --type all" }
          - { source: abeea,       cmd: "python -m scrapers.abeea.run --type all" }
          - { source: jurash,      cmd: "python -m scrapers.jurash.run --type all" }
          # DEALAPP_MAX_LISTINGS caps each run so it finishes inside the 90m budget (prune+end_run
          # run cleanly). enumerate_ids orders NEW sitemap listings first, so coverage climbs
          # run-over-run toward the full ~58k catalogue.
          #
          # The cap is now sized from MEASURED CI throughput, not guessed. The 2026-08-07 cap of
          # 12000 did NOT fit: run 31239278341 (2026-08-08) was cancelled at exactly 90m
          # (04:22:49 -> 05:52:46), so prune_unseen() and end_run() never ran, scrape_runs id 25397
          # is dangling ok=NULL forever, and dealapp's last-OK freshness signal froze at 08-07.
          # That run fetched 1,800 detail pages in ~83m of fetching = ~21.7/min at WORKERS=3
          # (dealapp's anonymous origin trips a login-wall above ~3 workers, so this is the ceiling
          # without a proxy). Budget: 90m - ~1m setup - ~7m sitemap enumeration - ~5m prune/end_run
          # = ~77m of fetching. 1200 listings = ~55m, leaving >20m of headroom for throttle
          # variance. scripts/verify-dealapp-crawl-budget.ts enforces this arithmetic.
          # To go faster, raise throughput (a proxy lifts the 3-worker throttle) or raise `tmo`
          # AND the cap together — never the cap alone. (bug-fix 2026-08-08)
          # dealapp MOVED OUT of this matrix 2026-08-11 (owner-approved option b) to
          # .github/workflows/dealapp-sharded.yml — a 12-shard fleet that covers the FULL active
          # inventory in one night. It must not run here as well: two crawls of the same catalogue
          # would double the load on an origin that already blocks under burst, and the unsharded
          # run would re-introduce the ~25%-coverage state that kept prune_unseen's coverage guard
          # permanently tripped. scripts/verify-dealapp-crawl-budget.ts fails CI if dealapp
          # reappears in this matrix.
          # عقاريون — 277 Riyadh listings across 31 pages, one detail fetch each. No proxy: the
          # site is plain nginx with no Cloudflare and answers a direct request in 1-3s.
          - { source: akariyoun,   cmd: "python -m scrapers.akariyoun.run --type all", tmo: 45 }
          - { source: ksaaqar,     cmd: "python -m scrapers.ksaaqar.run --type all", tmo: 90 }
          - { source: sadiqeltajer, cmd: "python -m scrapers.sadiqeltajer.run --type all", tmo: 90 }
          # ── onboarded 2026-09-20 ──────────────────────────────────────────────────────────────
          # gudai / safera / alhumaidan are three tenant offices of ONE inblaj.net WordPress
          # product and share scrapers/common/inblaj_platform.py, but each runs as its own source
          # so one office being down never hides another, and each keeps its own run ledger.
          - { source: gudai,         cmd: "python -m scrapers.gudai.run --type all", tmo: 20 }
          - { source: safera,        cmd: "python -m scrapers.safera.run --type all", tmo: 20 }
          - { source: alhumaidan,    cmd: "python -m scrapers.alhumaidan.run --type all", tmo: 20 }
          - { source: aqarnajran,    cmd: "python -m scrapers.aqarnajran.run --type all", tmo: 20 }
          - { source: fahadalshahri, cmd: "python -m scrapers.fahadalshahri.run --type all", tmo: 20 }
          # compoundin walks 129 compound pages and emits one row per UNIT, so it is the slowest
          # of this batch by page count even though its row count is small.
          - { source: compoundin,    cmd: "python -m scrapers.compoundin.run --type all", tmo: 45 }
          # wslnaa makes one tRPC call per slug (59) on top of the sitemap fetch.
          - { source: wslnaa,        cmd: "python -m scrapers.wslnaa.run --type all", tmo: 30 }
          # ── onboarded 2026-09-21: eleven platforms ─────────────────────────────────────────────
          # Each is its own matrix job, so one source down never hides another and each keeps its
          # own run ledger. None reads WASALT_PROXY_URL (checked) — no `proxy:` flag. `tmo` is sized
          # from each scraper's MEASURED cost (pages × (pause + response), response timed live on
          # 2026-09-21) with >=2x headroom, because a job killed at its limit never reaches
          # prune_unseen() or end_run() and leaves a dangling scrape_runs row (the dealapp lesson).
          # The first scrape of each is a manual dispatch with `source: <slug>` (the input above).
          #   API / REST sources — a handful of calls each:
          - { source: alsidra,     cmd: "python -m scrapers.alsidra.run --type all", tmo: 20 }
          - { source: moftah,      cmd: "python -m scrapers.moftah.run --type all", tmo: 20 }
          - { source: masar,       cmd: "python -m scrapers.masar.run --type all", tmo: 20 }
          #   aljassim: ~90 detail pages behind an hcdn challenge it solves in-process.
          - { source: aljassim,    cmd: "python -m scrapers.aljassim.run --type all", tmo: 20 }
          #   gomenassat: one POST for 256 offers, then ~150 detail pages (transacted ones skipped).
          - { source: gomenassat,  cmd: "python -m scrapers.gomenassat.run --type all", tmo: 20 }
          #   nufouth: 4 index pages + one API record per property (~270).
          - { source: nufouth,     cmd: "python -m scrapers.nufouth.run --type all", tmo: 30 }
          #   almotmkenah: all 361 index ads are fetched (the ~339 archived ones ARE its removal
          #   signal), 0.2s apart.
          - { source: almotmkenah, cmd: "python -m scrapers.almotmkenah.run --type all", tmo: 30 }
          #   ialqarawi: 66 whole-category pages, then ~2,641 detail pages over 8 worker threads
          #   (~0.6s each → ~4 min).
          - { source: ialqarawi,   cmd: "python -m scrapers.ialqarawi.run --type all", tmo: 45 }
          #   bossbih: 10 index pages + ~1,485 detail pages, sequential, 0.25s pause + ~0.2s
          #   response → ~11 min.
          - { source: bossbih,     cmd: "python -m scrapers.bossbih.run --type all", tmo: 60 }
          #   alshawaf: 26 index pages + ~987 detail pages, sequential, 0.3s pause + ~0.7s
          #   response → ~17 min.
          - { source: alshawaf,    cmd: "python -m scrapers.alshawaf.run --type all", tmo: 60 }
          #   sakan: ~3,160 detail pages (~500 KB each), sequential, 0.35s pause + ~0.7s response →
          #   ~56 min from a nearby egress; a US runner is slower per page, so 180 keeps >=2x
          #   headroom over a realistic ~90 min.
          - { source: sakan,       cmd: "python -m scrapers.sakan.run --type all", tmo: 180 }
          # ── onboarded 2026-09-24: thirty-five platforms ───────────────────────────────────────
          # Same shape as the 2026-09-21 batch above: one matrix job per platform, so one source
          # down never hides another and each keeps its own run ledger. Two carry `proxy: true` and read
          # WASALT_PROXY_URL / SCRAPE_PROXY_URL — sakani (Cloudflare challenge from a datacenter IP) and
          # eilmalriyada (api.eilmalriyada.com 403s datacenter IPs, 200 to residential on every TLS
          # profile) — both measured on the 2026-09-24 first cloud crawl; the other 33 hit their
          # sources directly. Every run.py
          # takes `--type all` (its argparse default) and prunes ONLY on a complete `all` walk.
          # `tmo` is sized from each scraper's MEASURED cost (its docstring: requests × (pause +
          # response)) with >=2x headroom, because a job killed at its limit never reaches
          # prune_unseen() or end_run() and leaves a dangling scrape_runs row (the dealapp lesson).
          # The first scrape of each is a manual dispatch with `source: <slug>` (the input above).
          #   dwelleo: RE-ONBOARDED 2026-09-24 (owner decision). 575 API pages + one detail record
          #   per listing (~11.5k, sequential, ~0.8 s response + SCRAPE_MIN_INTERVAL) — measured
          #   ~3.7 h for a full detailed walk. 360 is GitHub's hard job cap (6 h), so the headroom
          #   is ~1.6x, below the 2x rule; run.py's documented fallback is `--no-detail` (~5 min,
          #   one cover photo, no halls/amenity chips, no direct-alive stamp) if runs get killed at
          #   the limit. The detailed walk is kept deliberately (listing fidelity over runtime).
          #   KNOWN, NOT YET TUNED: mon_detect_dangling_scrape_run (migration 20260808062049) flags
          #   any run still open after 3 h, so every healthy dwelleo run raises a false "dangling"
          #   alert that self-resolves at end_run — that detector needs a per-platform floor
          #   (dwelleo >= 6 h) before this line goes live, or the daily alert must be acked.
          - { source: dwelleo,        cmd: "python -m scrapers.dwelleo.run --type all", tmo: 360 }
          #   aqalemhajer: 25 index pages (0.5 s pause) + ~1,229 detail pages (0.3 s pause). Its
          #   docstring records no live wall-clock (coverage was measured offline over saved
          #   pages): ~27 min at a 1 s response, ~47 min at 2 s from a US runner. 90 (the workflow
          #   default) keeps >=2x at 2 s; re-size from the first dispatched run's duration.
          - { source: aqalemhajer,    cmd: "python -m scrapers.aqalemhajer.run --type all", tmo: 90 }
          #   sakani: 15 API pages + 282 detail records at 1.5 s (measured 740 s dry run).
          - { source: sakani,         cmd: "python -m scrapers.sakani.run --type all", tmo: 45, proxy: true }
          #   API / REST sources whose whole catalogue is one page or a handful of calls:
          - { source: shatri,         cmd: "python -m scrapers.shatri.run --type all", tmo: 20 }
          - { source: almuteb,        cmd: "python -m scrapers.almuteb.run --type all", tmo: 20 }
          - { source: aalbarrak,      cmd: "python -m scrapers.aalbarrak.run --type all", tmo: 20 }
          - { source: aqaralriyadh,   cmd: "python -m scrapers.aqaralriyadh.run --type all", tmo: 20 }
          - { source: snam,           cmd: "python -m scrapers.snam.run --type all", tmo: 20 }
          - { source: goldendeal,     cmd: "python -m scrapers.goldendeal.run --type all", tmo: 20 }
          - { source: yameen,         cmd: "python -m scrapers.yameen.run --type all", tmo: 20 }
          - { source: tamyaz,         cmd: "python -m scrapers.tamyaz.run --type all", tmo: 20 }
          - { source: hazim,          cmd: "python -m scrapers.hazim.run --type all", tmo: 20 }
          #   jawher / m3tmd / senan: one API engine (scrapers/jawher/run.py), 145 / 46 / 82 detail
          #   records each, 0.4 s apart.
          - { source: jawher,         cmd: "python -m scrapers.jawher.run --type all", tmo: 20 }
          - { source: m3tmd,          cmd: "python -m scrapers.m3tmd.run --type all", tmo: 20 }
          - { source: senan,          cmd: "python -m scrapers.senan.run --type all", tmo: 20 }
          #   Small HTML catalogues — tens of detail pages at <=1 s each:
          - { source: alqasem,        cmd: "python -m scrapers.alqasem.run --type all", tmo: 20 }
          - { source: fkralemar,      cmd: "python -m scrapers.fkralemar.run --type all", tmo: 20 }
          - { source: wadod,          cmd: "python -m scrapers.wadod.run --type all", tmo: 20 }
          - { source: alrifai,        cmd: "python -m scrapers.alrifai.run --type all", tmo: 20 }
          - { source: sodasyat,       cmd: "python -m scrapers.sodasyat.run --type all", tmo: 20 }
          - { source: hasaad,         cmd: "python -m scrapers.hasaad.run --type all", tmo: 20 }
          - { source: justsa,         cmd: "python -m scrapers.justsa.run --type all", tmo: 20 }
          - { source: albdah,         cmd: "python -m scrapers.albdah.run --type all", tmo: 20 }
          - { source: eydah,          cmd: "python -m scrapers.eydah.run --type all", tmo: 20 }
          - { source: villassa,       cmd: "python -m scrapers.villassa.run --type all", tmo: 20 }
          - { source: marksa,         cmd: "python -m scrapers.marksa.run --type all", tmo: 20 }
          #   thousand: 105 cards + 105 detail pages at 0.5 s (measured 383 s).
          - { source: thousand,       cmd: "python -m scrapers.thousand.run --type all", tmo: 20 }
          #   ebriza: 22 API pages + one POST detail per record (207) at 0.7 s.
          - { source: ebriza,         cmd: "python -m scrapers.ebriza.run --type all", tmo: 20 }
          #   eilmalriyada: one catalogue call + 283 gallery records at 0.6 s.
          - { source: eilmalriyada,   cmd: "python -m scrapers.eilmalriyada.run --type all", tmo: 20, proxy: true }
          #   daryusuf: 3 REST pages + one page per post (290) at 1.0 s.
          - { source: daryusuf,       cmd: "python -m scrapers.daryusuf.run --type all", tmo: 30 }
          #   Compound sites (one row per unit type; the compound page is the unit of work):
          #   rightcompound walks 254 compound pages at 0.8 s; the other four walk 4-43 pages.
          - { source: rightcompound,  cmd: "python -m scrapers.rightcompound.run --type all", tmo: 30 }
          - { source: livingcompound, cmd: "python -m scrapers.livingcompound.run --type all", tmo: 20 }
          - { source: azure,          cmd: "python -m scrapers.azure.run --type all", tmo: 20 }
          - { source: expattrusted,   cmd: "python -m scrapers.expattrusted.run --type all", tmo: 20 }
          - { source: flow,           cmd: "python -m scrapers.flow.run --type all", tmo: 20 }
          - { source: erapulse,    cmd: "python -m scrapers.erapulse.run --type all" }
          - { source: nowaisiry,   cmd: "python -m scrapers.nowaisiry.run --type all" }
          - { source: october,    cmd: "python -m scrapers.october.run --type all" }
          # souq24 probes ~1,300 candidate ids/run through the metered Saudi proxy for only ~52 active
          # listings, and the sweep deliberately re-checks the whole id range (skipping ids would miss
          # reactivated ads). So we cut its bandwidth by cadence instead: every_n_days=2 (owner 2026-07-07).
          # (tmo+cadence restored 2026-07-16 — PR #77 accidentally dropped both overrides.)
          - { source: souq24,     cmd: "python -m scrapers.souq24.run --type all", tmo: 150, every_n_days: 2, proxy: true }
          # NOTE: toor is NOT here. RETIRED 2026-07-06 (owner-approved, commit d5ca9d6).
          # THE ORIGINAL REASON (IP-block: every detail fetch exc:Timeout) IS FIXED — re-probed
          # 2026-09-19, sitemap + details all return HTTP 200 from a clean egress. It stays out for
          # a DIFFERENT verified reason: toor.ooo is now an SPA whose public HTML serves ONE SAMPLE
          # LISTING for every PropertyId (6 different ids -> 1 distinct licence/ref), so running it
          # would write 82 copies of one fabricated listing. The real data is behind an
          # authenticated API (401). See scrapers/RETIRED_PLATFORMS.txt for the measurement.
          # Historical toor rows are KEPT in the DB (not deleted) and scrapers/toor/ remains in
          # the repo for reference. PR #77 (da19962) accidentally re-added the matrix line on
          # 2026-07-15; re-removed 2026-07-16 and now guarded by scrapers/RETIRED_PLATFORMS.txt +
          # scrapers/common/tests/test_retired_platforms_guard.py, which fails CI if any retired
          # platform re-enters an active matrix. Do NOT re-add without owner approval (un-retire
          # by removing the slug from RETIRED_PLATFORMS.txt in the same PR). See ARCHITECTURE.md
          # "Retired platforms".
          # jazwtn UN-RETIRED 2026-07-27 (owner-instructed, same day): the retirement note below
          # said "a non-runner egress IP (residential proxy) is required — re-adding this line
          # alone will not work". PR#230 delivered that proxy egress, and it records a scrape_runs
          # row BEFORE the sitemap fetch so a re-block fails LOUD, not silently.
          #
          # 2026-07-28: the proxy fallback was REMOVED. Two fixes shipped for the same 07-23 root
          # cause within 24h — the proxy (PR#230) and the curl_cffi 0.7.4->0.15.0 fingerprint bump
          # (PR#245) — and the proxy became the failing half: every run since 07-27 15:16 died with
          # `curl (35) TLS connect error: invalid library (OPENSSL_internal)`, a CONNECT-tunnel
          # failure, not a rejection by jazwtn.sa. Measured 07-28 with 0.15.0 straight at the
          # origin: `/` -> 200/204,697B and `/sitemap.xml` -> 200/1,768B. So this leg now goes
          # DIRECT; JAZWTN_PROXY_URL / SCRAPE_PROXY_URL remain explicit opt-ins if the
          # datacenter-IP block returns. It no longer inherits WASALT_PROXY_URL (provisioned for
          # Wasalt, metered, and empirically broken for this host).
          # If this leg fails again DIRECT with a reset, set JAZWTN_PROXY_URL to a WORKING proxy
          # (verify the tunnel first) or re-retire — do not re-point it at the wasalt secret.
          - { source: jazwtn,      cmd: "python -m scrapers.jazwtn.run --type all" }
          - { source: therc,       cmd: "python -m scrapers.therc.run --type all" }
          - { source: aouj,        cmd: "python -m scrapers.aouj.run --type all" }
          # Two GREEN-audited additions (owner-instructed 2026-09-05, from the 40-candidate audit).
          # Both are WordPress REST sources whose taxonomies resolve live, so their type/city maps
          # are fetched per run rather than frozen here.
          #   alta          17 posts; 10 already تم البيع/تم التأجير → stored active=false. Only 1
          #                 post states a price, so 15 carry NULL — a SOURCE fact, never inferred.
          #   shmoualshmal   6 posts, all Tabuk. The site publishes NO price at all (it shows
          #                 «اتصل»), so every price column is NULL by design. See each run.py.
          - { source: alta,         cmd: "python -m scrapers.alta.run --type all", every_n_days: 2 }
          - { source: shmoualshmal, cmd: "python -m scrapers.shmoualshmal.run --type all", every_n_days: 2 }
          # Two more GREEN-audited additions (owner-instructed 2026-09-06).
          #   remal   87 posts -> 84 listings. class_list carries city/type/offer; images bind by
          #           attachment PARENT because the detail page renders OTHER listings' photos.
          #   amaall  135 posts -> 50 listings, ARABIC ONLY: the site publishes every listing twice
          #           (68 EN + 67 AR), so taking both languages would double every property.
          - { source: remal,        cmd: "python -m scrapers.remal.run --type all", every_n_days: 2 }
          - { source: amaall,       cmd: "python -m scrapers.amaall.run --type all", every_n_days: 2 }
          # abwbna (owner-instructed 2026-09-06): a DIFFERENT TENANT of the SAME Nuzul SaaS platform
          # aldarim already scrapes (same S3 bucket family, same public JSON API shape). Full crawl +
          # prune, same as aldarim — not a --type flag scraper.
          - { source: abwbna,       cmd: "python -m scrapers.abwbna.run --pages 50" }
          # bahadhabab + alobid (owner-instructed 2026-09-06): third and fourth Nuzul SaaS tenants
          # found the same way — full crawl + prune, same as aldarim/abwbna, not a --type flag scraper.
          # bahadhabab: city is a hardcoded owner-confirmed business fact (single-region brokerage in
          # الباحة) — see scrapers/bahadhabab/run.py's module docstring.
          - { source: bahadhabab,   cmd: "python -m scrapers.bahadhabab.run --pages 50" }
          - { source: alobid,       cmd: "python -m scrapers.alobid.run --pages 50" }
          # azdad (corrected 40-candidate-audit link, 2026-09-06): own Next.js + Supabase stack, not
          # a Nuzul/Wasalt clone. The whole catalogue (25 listings) fits in one request — no
          # --pages/--type flag, run.py fetches everything and prunes on absence every run.
          - { source: azdad,        cmd: "python -m scrapers.azdad.run" }
          - { source: abralosol,   cmd: "python -m scrapers.abralosol.run --type all" }
          - { source: arkaan,      cmd: "python -m scrapers.arkaan.run --type all" }
          - { source: rawasidark,  cmd: "python -m scrapers.rawasidark.run --type all" }
          # amlakalahsa (owner-approved 2026-09-12, ops_incident #2667/daily-engineer 2026-09-13):
          # scrapers/amlakalahsa/run.py shipped the same day the platform was approved, but no
          # workflow ever scheduled it — zero scrape_runs rows ever existed for it (its own 236
          # production_ready rows came from a one-off manual/backfill run). No --type/--pages flag:
          # like azdad, run.py fetches its whole small WordPress catalogue in one pass.
          - { source: amlakalahsa, cmd: "python -m scrapers.amlakalahsa.run" }
          # aqaralsaudia (owner-approved 2026-09-13): العروض العقارية, Riyadh-only RealHomes site.
          # Scheduled in the SAME change that adds the scraper — the barrier that caught amlakalahsa
          # shipping unscheduled exists precisely so this is never a follow-up.
          - { source: aqaralsaudia, cmd: "python -m scrapers.aqaralsaudia.run" }
          # suwar (owner-approved 2026-09-14): سوار العقارية, a Makkah freehold developer, 167
          # published listings. Scheduled in the SAME change that adds the scraper — the barrier
          # that caught amlakalahsa shipping unscheduled exists precisely so this is never a
          # follow-up. It fetches one detail page per listing (~170 GETs, ~2 min), so it needs no
          # timeout override.
          - { source: suwar, cmd: "python -m scrapers.suwar.run" }
          # rakez (owner-approved 2026-09-14): راكز العقارية, a Riyadh-led developer. Its unit
          # feed is 145 REST pages plus one Arabic-twin page per project (~420 requests, ~6 min).
          # Scheduled in the SAME change that adds the scraper — the barrier
          # verify-every-scraper-has-a-scheduled-workflow.ts caught this exact omission before merge.
          - { source: rakez, cmd: "python -m scrapers.rakez.run" }
          # NOTE: alnokhba is NOT here. Deprecated 2026-07-14 — alnokhba-services.com's domain
          # lapsed into a parking page (HTTP 200, but a domain-resale placeholder, no
          # property-card markup); scrape_runs went from rows_seen=5 (2026-07-07) to
          # rows_seen=0/ok=true for 7 straight daily runs (2026-07-08..2026-07-14). See
          # deprecated_platforms / platforms_deprecated_status and docs/ARCHITECTURE.md §12 for
          # the full record. Do not re-add without confirming the domain serves real listings
          # again.
          # NOTE: muktamel is NOT here. Its pages are ~1.4MB each and it has no list API / usable
          # sitemap, so a full sequential-ID scan is ~45GB over hours — impossible on a 4h cadence.
          # It runs on its OWN weekly workflow (muktamel-sync.yml), scoped to the live ID band.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: scrapers/requirements.txt
      - name: Install scraper dependencies
        run: pip install -r scrapers/requirements.txt
      - name: Sync ${{ matrix.source }}
        # Skip non-matching sources when a single source was requested via workflow_dispatch.
        # A comma-separated list runs exactly those sources in ONE run: the concurrency group keeps
        # only one PENDING run, so per-slug dispatches cancel each other (seen 2026-09-24).
        if: ${{ github.event.inputs.source == '' || contains(format(',{0},', github.event.inputs.source), format(',{0},', matrix.source)) }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPE_MIN_INTERVAL: "0.3"
          # PROXY IS OPT-IN PER SOURCE (2026-09-18). It used to be set matrix-wide under the
          # comment "Every other source's scraper ignores this var, so it's harmless" — which was
          # FALSE: alta, remal, shmoualshmal and amaall all read WASALT_PROXY_URL in their own
          # session() and were silently spending metered Saudi residential bandwidth.
          #
          # Only sources with `proxy: true` receive it. NOTHING currently sets it.
          #
          # souq24 CAME OFF IT 2026-09-18, on a note that read "24.com.sa's Cloudflare serves
          # datacenter IPs a listing-less shell" and was wrong on its own terms that day: there was
          # no Cloudflare (`Server: nginx`, zero cf-ray/cf-cache), and /properties answered DIRECT
          # with HTTP 200, 161 KB, 18 real /<id>/<slug> links. Meanwhile the proxy hop measured a
          # failure for exactly this client shape (wasalt-proxy-diagnostic.yml, same day: the
          # CONNECT tunnel opened fine but curl_cffi impersonating chrome124 -- precisely what
          # scrapers/souq24/run.py uses -- TIMED OUT at 15,002 ms). So the proxy came off, with an
          # explicit test written down for what would put it back: "if souq24 now fails DIRECT with
          # a REFUSAL (403, connection reset, or a listing-less shell) ... put `proxy: true` back
          # on. A timeout is not a refusal."
          #
          # `proxy: true` IS BACK ON (2026-09-24, daily engineer) — souq24 met exactly that test.
          # scrapers/souq24/run.py used to swallow a page's status/exception once retries were
          # exhausted (fixed in #3862, same day): harvest_ids() read `.text` regardless of
          # `.status_code`, so a WAF/soft-block response served without ever raising was invisible.
          # With that fix landed, a DIRECT dispatch (workflow run 36017619031) recorded:
          #
          #   harvest: 23/23 browse pages in 2.0s (0 failed, 8 workers, 15s/page) -> 0 seed ids
          #   fetch failures: http_200_zero_ids_all_pages=1
          #
          # Every page answered 200 with no transport failure and no bad status — not a timeout,
          # not a 403 — and extracted zero listing ids from all 23 pages in 2 seconds flat. That IS
          # "a listing-less shell": a clean, fast, empty response, the exact positive case the
          # 09-18 note's own test named as sufficient without also requiring a refusal. This had
          # been running DIRECT and silently 0-row since 09-20 (silent_scraper_death P0, issue
          # #3742) with no way to tell a block from markup drift until the diagnostic above
          # existed. If the next proxied run also comes back 0 seed ids, the block is not proxy-
          # shaped after all and this reasoning needs revisiting — do not treat `proxy: true` as a
          # permanent fix, only as the next measurement.
          #
          # WHY THE OTHERS WERE TAKEN OFF IT. Measured 2026-09-18: alta, remal and shmoualshmal all
          # answer a DIRECT request in 1-2s (alta.com.sa 0.97s, remalre.com 1.6s,
          # shmoua-alshmal.com 2.0s) and NONE of them is behind Cloudflare — their servers are
          # hcdn / Apache / hcdn. Yet through the proxy every run dies at exactly
          # `curl: (28) Connection timed out after 40001ms`. A plain Apache host that answers in
          # 1.6s direct is not the thing timing out; the proxy hop is. The older note here claimed
          # the runner's datacenter IP was blocked for these hosts ("six taxonomy requests burned
          # 3m40s on alta") — 3m40s is SLOW, not BLOCKED, and reads like the same proxy-hop stall
          # rather than a refusal. So the proxy is removed for them and the next scheduled run is
          # the test: if they come back green, the proxy was the cause and the metered spend was
          # pure waste; if they fail DIRECT with a refusal (403/connection reset rather than a
          # timeout), put `proxy: true` back on them and the old note was right.
          #
          # Before adding a source here, check whether its session() reads WASALT_PROXY_URL.
          WASALT_PROXY_URL: ${{ matrix.proxy && secrets.WASALT_PROXY_URL || '' }}
        run: |
          # Per-source cadence (owner 2026-07-07): most small sources run daily (every_n_days unset = 1),
          # but a few (souq24) scrape every N days to cut metered-proxy bandwidth. Skip today when the
          # epoch-day isn't a run-day for this source. A MANUAL single-source dispatch always runs
          # (source input non-empty) so you can force a scrape on an off day.
          # (Restored 2026-07-16 — PR #77 accidentally flattened this back to a bare `run: cmd`.)
          N="${{ matrix.every_n_days || 1 }}"
          if [ "$N" != "1" ] && [ -z "${{ github.event.inputs.source }}" ] && [ "$(( $(date -u +%s) / 86400 % N ))" -ne 0 ]; then
            echo "::notice::Skipping ${{ matrix.source }} today — every-${N}-days cadence (off day). Manual single-source dispatch overrides."
            exit 0
          fi
          exec ${{ matrix.cmd }}
