name: Ad viewer speed — live guard

# Owner 2026-10-03: «how to always keep it like this quick … always, no matter what». The in-app ad
# viewer (Deal App / Gathern open inside Ezhalah) must show an ad as fast as a normal browser tab.
# This drives e2e/viewer/speed-live.mjs on a phone over throttled 4G against production: every in-app
# site must still allow framing, show its ad inside a frame within budget, and production must ship the
# instant-show tab (never the old blank «loading» cover). Read-only. A red run reaches the engineers
# through the alert_event bridge below.

on:
  schedule:
    - cron: '23,53 * * * *' # every 30 min (owner 2026-10-21: «every hour» → «could it be less than a hour»); a run takes ~13 min, so 30 min never overlaps
  # ONE AFTER ANOTHER (P1 2026-10-23): runs after Selector E2E, which runs after Guardian journeys, instead of all
  # post-deploy robots starting together. scripts/verify-post-deploy-robots-run-in-turn.ts.
  workflow_run:
    workflows: ['Selector E2E (production)']
    types: [completed]
  workflow_dispatch:

concurrency:
  group: ad-viewer-speed-live
  cancel-in-progress: false

env:
  # Robot pass (docs/ops/SCRAPE_GUARD.md): scripts/lib/robotPass.mjs sends it only to our own front door, so our
  # browser robots are never refused by the network guard or the bot checks. Empty on fork PRs = no pass, no change.
  EZ_GATE_SECRET: ${{ secrets.EZ_GATE_SECRET }}

jobs:
  speed:
    runs-on: ${{ (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && vars.EZ_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 60
    # Chained: run only when Selector E2E ran for a deploy chain and was not skipped (a failed deploy skips the chain).
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'workflow_run' && github.event.workflow_run.conclusion != 'skipped')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright + browser
        run: |
          npm i -D @playwright/test@^1.49
          npx playwright install --with-deps chromium
      - name: Phone + 4G — every in-app site frames, shows fast, production has the fix
        env:
          BASE_URL: https://ezhalah-app.vercel.app
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node e2e/viewer/speed-live.mjs

      - name: Bridge this run's result to alert_event
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: >-
          node scripts/ops/raise-workflow-alert.mjs
          --kind journey_live_check_failed
          --workflow ad-viewer-speed-live.yml
          --status ${{ job.status }}
          --run-url ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
