# Front door secret handshake (security plan Phase 4.3, 2026-10-21; docs/ops/SCRAPE_GUARD.md).
# Copies the EZ_GATE_SECRET repository secret into the database (guard.front_door_secret, via the service-role-only
# ops_set_front_door_secret), so robot_gate believes the visitor address api/sb.ts forwards. The same value must be in
# the Vercel project env as EZ_GATE_SECRET. Dispatch-only: run it once after setting or rotating the secret. The value
# never appears in a log, a migration or a chat.
name: Front door secret

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  # Secret handshake (docs/ops/SCRAPE_GUARD.md): scripts/lib/gateFetch.mjs and robotPass.mjs send it only to our own
  # database and front door, so our robots keep working once the back door closes. Empty on fork PRs = unchanged.
  EZ_GATE_SECRET: ${{ secrets.EZ_GATE_SECRET }}

jobs:
  set-secret:
    name: Store the front-door handshake secret in the database
    runs-on: ${{ (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && vars.EZ_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 3
    steps:
      - name: Store secret
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EZ_GATE_SECRET: ${{ secrets.EZ_GATE_SECRET }}
        run: |
          set -euo pipefail
          if [ "${#EZ_GATE_SECRET}" -lt 32 ]; then echo "EZ_GATE_SECRET is missing or shorter than 32 characters"; exit 1; fi
          body=$(jq -n --arg s "$EZ_GATE_SECRET" '{p_secret: $s}')
          code=$(curl -s -o /tmp/out -w '%{http_code}' -X POST "$SUPABASE_URL/rest/v1/rpc/ops_set_front_door_secret" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H 'content-type: application/json' --data "$body")
          if [ "$code" != "200" ]; then echo "store failed: HTTP $code"; head -c 300 /tmp/out; exit 1; fi
          echo "front-door secret stored (length ${#EZ_GATE_SECRET})."
