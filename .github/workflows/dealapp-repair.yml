# Deal App legacy fidelity repair — re-fetches candidate ads (pre-2026-07-14 rows + x100-price /
# concatenated-area signatures) and re-parses them with the CURRENT production parser, so the two
# legacy corruption classes (decimal-stripped x100 prices, description digit-concat areas) are
# replaced by the live source values. Fidelity-safe: values come only from the live page; no local
# arithmetic. See scrapers/dealapp/repair.py header (bug-hunt 2026-07-30).
#
# MANUAL DISPATCH ONLY — a one-shot repair, not a recurring job.

name: Dealapp repair

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Cap candidates per table (0 = all)"
        default: "0"
      dry_run:
        description: "true = fetch+parse+report only, write nothing"
        default: "false"
      plot_code_districts:
        description: "true = re-parse the rows whose stored district is a plot/plan code, instead of the legacy set"
        default: "false"
      ambiguous_towns:
        description: "true = re-parse the rows with no city whose town is a city in several regions (placed by own pin)"
        default: "false"

concurrency:
  group: dealapp-repair
  cancel-in-progress: false

env:
  # Secret handshake (docs/ops/SCRAPE_GUARD.md): scripts/lib/gateFetch.mjs and robotPass.mjs send it only to our own
  # database and front door, so our robots keep working once the back door closes. Empty on fork PRs = unchanged.
  EZ_GATE_SECRET: ${{ secrets.EZ_GATE_SECRET }}

jobs:
  repair:
    name: Re-fetch + re-parse legacy dealapp rows
    runs-on: ${{ (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && vars.EZ_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: scrapers/requirements.txt

      - name: Install scraper dependencies
        run: pip install -r scrapers/requirements.txt

      - name: Repair sweep
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          exec python -m scrapers.dealapp.repair \
            --limit ${{ github.event.inputs.limit || '0' }} \
            --workers 6 \
            $([ "${{ github.event.inputs.dry_run }}" = "true" ] && echo --dry-run) \
            $([ "${{ github.event.inputs.plot_code_districts }}" = "true" ] && echo --plot-code-districts) \
            $([ "${{ github.event.inputs.ambiguous_towns }}" = "true" ] && echo --ambiguous-towns)
