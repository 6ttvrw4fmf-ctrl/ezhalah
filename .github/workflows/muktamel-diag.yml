# Muktamel page-structure diagnostic — ONE-OFF evidence gathering, not a data pipeline.
#
# WHY THIS EXISTS: this repo's own sandbox/dev environments cannot reach muktamel.com (outbound
# network policy). scrapers/muktamel/diag_page_structure.py fetches real listing pages and prints
# their raw structure so a scraper rebuild is based on actual evidence, never a guess. It writes
# NOTHING to any database — no Supabase secret is needed or granted.
#
# This workflow is intentionally NOT on any schedule and carries no cron trigger — dispatch it by
# hand (workflow_dispatch) only when diagnosing a real structural question.

name: Muktamel page-structure diagnostic

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Comma-separated listing ids to dump (e.g. 24000,24001,24005)"
        required: true

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: scrapers/requirements.txt
      - name: Install scraper dependencies
        run: pip install -r scrapers/requirements.txt
      - name: Dump raw page structure
        run: exec python -m scrapers.muktamel.diag_page_structure --ids "${{ github.event.inputs.ids }}"
