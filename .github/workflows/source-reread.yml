# Re-read original ads, independently of our parsers (docs/ops/NEW_LISTINGS_ENGINEER.md, step 6
# way (b)). Saves, for each listing, what the PAGE says (JSON-LD, meta tags, the visible lines that
# carry a price, size, rooms or an amenity) next to every value we serve, in the `source-reread`
# artifact. The cloud engineers cannot open listing websites themselves (the sites block their
# address), so they dispatch this and read the artifact.
#
# READ-ONLY: scrapers/common/source_reread.py writes nothing to the database. Dispatch-only.
name: Source re-read

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "table:id,table:id — exactly these listings (or leave empty and give platform)"
        type: string
        default: ""
      platform:
        description: "Sample this website's new listings instead of ids"
        type: string
        default: ""
      n:
        description: "How many to sample when using platform"
        type: string
        default: "20"
      new_hours:
        description: "New = first seen within this many hours"
        type: string
        default: "24"
      around:
        description: "Print the page HTML around this word (markup diagnostic; phone-like numbers redacted)"
        type: string
        default: ""

permissions:
  contents: read

env:
  # Robot pass (docs/ops/SCRAPE_GUARD.md): scripts/lib/robotPass.mjs sends it only to our own front door, so our
  # browser robots are never refused by the network guard or the bot checks. Empty on fork PRs = no pass, no change.
  EZ_GATE_SECRET: ${{ secrets.EZ_GATE_SECRET }}

jobs:
  reread:
    runs-on: ${{ (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && vars.EZ_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: scrapers/requirements.txt
      - name: Install scraper dependencies
        run: pip install -r scrapers/requirements.txt
      - name: Install Chromium for the Cloudflare path
        # apt behind «--with-deps» flaked twice in a row on 2026-11-11 («Some index files failed to download», exit 100;
        # runs 43030869859 / 43030970921): three tries with a pause, so a mirror blip never fails a proof run.
        run: |
          ok=0; for i in 1 2; do timeout 240 python -m playwright install --with-deps chromium && { ok=1; break; }; echo "playwright install --with-deps failed or hung on apt (try $i)"; sleep 15; done
          # 2026-11-11 15:0x: three tries still failed (the apt mirror of the runner image was down) — the Ubuntu runner image already
          # carries the browser libraries, so the browser itself is installed without apt and the run goes on; a missing lib fails the launch, visibly.
          [ "$ok" = 1 ] || { echo "apt still failing — installing the browser without --with-deps"; python -m playwright install chromium; }
      - name: Re-read the original ads
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WASALT_PROXY_URL: ${{ secrets.WASALT_PROXY_URL }}
          WASALT_BROWSER: "1"
          IDS: ${{ inputs.ids }}
          PLATFORM: ${{ inputs.platform }}
          N: ${{ inputs.n }}
          NEW_HOURS: ${{ inputs.new_hours }}
          AROUND: ${{ inputs.around }}
        run: |
          exec xvfb-run -a python -m scrapers.common.source_reread \
            --ids "$IDS" --platform "$PLATFORM" --n "$N" --new-hours "$NEW_HOURS" --around "$AROUND"
      - name: Keep the result for the engineer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-reread
          path: reread.json
          if-no-files-found: ignore
          retention-days: 14
