# Gathern detail backfill — fills description + the rich detail-page fields (families/singles
# suitability, house rules, check-in/out hours, guest capacity, booking/views counts, rating word,
# extra description sections) that the fast list crawl (gathern-sync.yml) does NOT fetch.
#
# WHY a SEPARATE workflow: these fields live only on each unit's own page (gathern.co/view/…), one
# HTTP request per unit — far heavier than the list feed. So it runs on its own cadence, NEVER inside
# the crawl. Idempotent + resumable — re-dispatching just continues filling whatever's still empty.
#
# CONCURRENCY = 1 (no shard matrix). 2026-07-24 diagnosis: Gathern rate-limits (HTTP 429) as soon as
# MORE THAN ONE runner/IP fetches detail pages at once — the old 12-shard matrix stalled the tail at
# ~89% (11× 429 in run 30081788882), and even 2 shards @0.9s still tripped it (8 then 20 blocks in
# runs 30093444733 / 30094829420). A single runner at ~1 req/s sustained 44 consecutive fetches with
# ZERO blocks in the manual probe. The worklist is now ordered freshest-first (run.py: last_seen_at
# DESC), so the dead-404 tail (delisted units — nothing to fetch) sinks to the end and the fillable
# rows go first. ~2.5k missing rows × ~1.4s ≈ ~60 min in one pass; the 180-min timeout has ample room.
name: Gathern detail backfill

on:
  workflow_dispatch:

concurrency:
  group: gathern-backfill-details
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: scrapers/requirements.txt
      - name: Install scraper dependencies
        run: pip install -r scrapers/requirements.txt
      - name: Gathern detail backfill (single gentle runner)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPE_MIN_INTERVAL: "1.0"   # ~1 req/s single runner = the block-free rate the probe proved
        run: python -m scrapers.gathern.run --backfill-details
