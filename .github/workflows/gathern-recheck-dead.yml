# GATHERN RESURRECTION PASS, EVERY DAY (♻️ Lifecycle Engineer, 2026-10-06).
#
# gathern-liveness.yml has had a --recheck-dead mode since 2026-08-22: it re-reads units the sweep
# already hid and RESTORES any whose own page answers a literal 200. It can only restore: it never
# hides, never raises a strike and needs no kill cap. But it ran only on a manual dispatch, so a
# unit that came back stayed hidden until the 30-day cleanup re-read it. Measured 2026-10-06: unit
# 276709 (row 14411421), hidden 2026-10-05 18:40 UTC after three applied 404s, answered 200 to
# gathern's own reader at 11:14 UTC the next morning (lifecycle-spot-check run 37455060681) and to
# ⚡ from two devices at 06:19 UTC. LIFECYCLE_ENGINEER.md: "Hidden listings keep being checked too",
# and a hidden ad whose own page is live again is shown again.
#
# pg_cron dispatches this file (trigger_gh_workflow cannot pass inputs, which is why it is its own
# file rather than an input of gathern-liveness.yml). Same code, same session, same canary gate,
# same apply lock and the same concurrency group as the hourly sweep, so the two never overlap.
# Newest kills first, 1,500 a run (~25 min at 1 read/s): a false hide is undone the next day.
name: Gathern recheck dead (daily resurrection)

on:
  workflow_dispatch:

concurrency:
  group: gathern-liveness
  cancel-in-progress: false

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: scrapers/requirements.txt
      - name: Install scraper dependencies
        run: pip install -r scrapers/requirements.txt
      - name: Re-read hidden gathern units and restore any whose own page is live
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPE_MIN_INTERVAL: "1.0"
          APPLY_FLAG: ${{ github.ref == 'refs/heads/main' && '--apply' || '' }}
        run: |
          exec python -m scrapers.gathern.liveness \
            --limit 1500 --canaries 10 --recheck-dead $APPLY_FLAG

      - name: Bridge this run's result to alert_event
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: >-
          node scripts/ops/raise-workflow-alert.mjs
          --kind ingestion_check_failed
          --workflow gathern-recheck-dead.yml
          --status ${{ job.status }}
          --run-url ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
