# Advanced Filter hourly robot customer — the 🔬 engineer's night-2 safety net (owner 2026-10-04). No AI:
# 10 rotating real listings that store a yes for an Advanced Filter answer, each asked for through the
# PUBLIC anon RPC the app uses (scrapers/common/af_robot.py). A miss raises a P2 alert (af_robot_miss) and
# one work-queue row, and fails this job. Dispatch-only: pg_cron row gh-af-robot calls
# trigger_gh_workflow('af-robot.yml') at :41 every hour (clear of the :22 search sync).
# READ-ONLY on listings.
name: AF robot customer

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the result, raise and write nothing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: af-robot
  cancel-in-progress: false

jobs:
  robot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: scrapers/requirements.txt
      - name: Install scraper dependencies
        run: pip install -r scrapers/requirements.txt
      - name: Ask for 10 real listings the way a customer would
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: exec python -m scrapers.common.af_robot $([ "$DRY_RUN" = "true" ] && echo --dry-run)
