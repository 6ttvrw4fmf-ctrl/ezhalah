# Advanced Filter hourly robot customer — the 🔬 engineer's night-2 safety net (owner 2026-10-04). No AI:
# 10 rotating real listings that store a yes for an Advanced Filter answer, each asked for through the
# PUBLIC anon RPC the app uses (scrapers/common/af_robot.py). A miss raises a P2 alert (af_robot_miss) and
# one work-queue row, and fails this job. Dispatch-only: pg_cron row gh-af-robot calls
# trigger_gh_workflow('af-robot.yml') at :41 every hour (clear of the :22 search sync).
# READ-ONLY on listings. It never opens a page, but it imports af_score's request builder, whose module
# graph reaches the wasalt browser — so it carries the same transport every such job must
# (verify-wasalt-probing-workflows-carry-the-browser.ts).
name: AF robot customer

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the result, raise and write nothing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: af-robot
  cancel-in-progress: false

env:
  # Robot pass (docs/ops/SCRAPE_GUARD.md): scripts/lib/robotPass.mjs sends it only to our own front door, so our
  # browser robots are never refused by the network guard or the bot checks. Empty on fork PRs = no pass, no change.
  EZ_GATE_SECRET: ${{ secrets.EZ_GATE_SECRET }}

jobs:
  robot:
    runs-on: ${{ (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && vars.EZ_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: scrapers/requirements.txt
      - name: Install scraper dependencies
        run: pip install -r scrapers/requirements.txt
      - name: Install Chromium for the Cloudflare path
        run: |
          # apt behind «--with-deps» flaked on 2026-11-11 (exit 100); three tries, a mirror blip never fails a run.
          ok=0; for i in 1 2 3; do python -m playwright install --with-deps chromium && { ok=1; break; }; echo "playwright install --with-deps failed (try $i)"; sleep 15; done
          # 2026-11-11 15:0x: three tries still failed (the apt mirror of the runner image was down) — the Ubuntu runner image already
          # carries the browser libraries, so the browser itself is installed without apt and the run goes on; a missing lib fails the launch, visibly.
          [ "$ok" = 1 ] || { echo "apt still failing — installing the browser without --with-deps"; python -m playwright install chromium; }
      - name: Ask for 10 real listings the way a customer would
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          WASALT_BROWSER: "1"
          DRY_RUN: ${{ inputs.dry_run }}
        run: exec xvfb-run -a python -m scrapers.common.af_robot $([ "$DRY_RUN" = "true" ] && echo --dry-run)
