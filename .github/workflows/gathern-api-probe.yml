# Gathern per-unit API discriminator (owner-requested, 2026-09-03) -- see
# scrapers/gathern/probe_unit_api.py for the full context.
#
# READ-ONLY RECONNAISSANCE. No database credentials are provided to this job at all, so it cannot
# write listing state even by accident: no SUPABASE_URL, no SUPABASE_SERVICE_ROLE_KEY. It fetches a
# bounded set of URLs from the host our crawl already reaches every day and prints a table.
#
# It runs in CI rather than from an audit container because the audit container's egress policy
# blocks msapi.gathern.co and api.gathern.co, while the GitHub Actions runner reaches them daily
# (12/12 ok gathern crawls straight through the 09-01..09-03 web-host block).
#
# EXCEPTION, mode=short-stays-dry only (2026-10-27): the crawl maps locations through
# scrapers/common/arabic_location.py, which READS loc_catalog_* via the service client, so that step
# gets SUPABASE_URL + key. It runs run.py --dry-run, which returns before begin_run() and every write.
#
# Do NOT add a schedule. Dispatch-only, on demand, like wasalt-proxy-diagnostic.yml.

name: Gathern per-unit API probe

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "unit-api (per-unit endpoint discriminator) | app-link (does any web link open an app-only unit? 2026-10-06) | short-stays-dry (chalets/rest houses/camps, mapped and printed, nothing written; 2026-10-27)"
        required: false
        default: "unit-api"
      units:
        description: "app-link mode only: chalet:unit pairs to test (comma list) instead of sampling the search"
        required: false
        default: ""

concurrency:
  group: gathern-api-probe
  cancel-in-progress: false

env:
  # Secret handshake (docs/ops/SCRAPE_GUARD.md): scripts/lib/gateFetch.mjs and robotPass.mjs send it only to our own
  # database and front door, so our robots keep working once the back door closes. Empty on fork PRs = unchanged.
  EZ_GATE_SECRET: ${{ secrets.EZ_GATE_SECRET }}

jobs:
  probe:
    name: Does a per-unit endpoint exist, and does it discriminate?
    runs-on: ${{ (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && vars.EZ_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: scrapers/requirements.txt
      - name: Install scraper dependencies
        run: pip install -r scrapers/requirements.txt
      - name: Short-stays dry run (reads the location catalogue, writes nothing)
        if: github.event.inputs.mode == 'short-stays-dry'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GATHERN_SHORT_STAYS: "1"
          GATHERN_DRY_SHOW: "40"
        run: exec python -m scrapers.gathern.run --dry-run --shard 1/12 --max-pages 4
      - name: Probe (read-only, no DB credentials in scope)
        if: github.event.inputs.mode != 'short-stays-dry'
        env:
          PROBE_UNITS: ${{ github.event.inputs.units }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "app-link" ]; then
            exec python -m scrapers.gathern.probe_app_only_link
          fi
          exec python -m scrapers.gathern.probe_unit_api
