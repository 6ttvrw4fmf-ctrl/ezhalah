# GUARDIAN JOURNEYS (2026-09-04). The production journey suite for the user-facing surfaces that had
# ZERO live browser coverage — dark mode, New Chat starting blank, the signed-out auth surface, Back
# after a search, ResultCard field content, loaders resolving, the /about + /support doors, and
# empty-result honesty. Those are exactly the surfaces the owner has been testing by hand.
#
# Read-only against production: never signs in, never submits the support form, never writes through
# the UI. A PRODUCT failure opens an owned ops_incident (P1, source 'journey'); a HARNESS failure is
# reported UNDETERMINED and files nothing — see e2e/guardian/run.mjs for why that split is the whole
# point. Runs daily, and again after every successful production deploy, because a deploy is when a
# surface most often breaks.
name: Guardian journeys (production)

on:
  schedule:
    # EVERY 30 MINUTES (owner 2026-10-23, step 2 of the self-healing proposal, free tier): this suite
    # is the live pulse of the customer-facing surfaces until a paid synthetic monitor exists. It is
    # read-only, 8 journeys x 2 viewports, about 7 minutes. :07/:37 sit off the :00/:14 data-refresh
    # ticks (pg_cron jobids 17 and 28) and off the 15-minute drift-guard slots. GitHub's scheduler
    # drops roughly half of declared runs (measured in gathern-liveness.yml), so this is a floor of
    # about 20 runs a day, not a promise of 48 — which is still 20x the one daily run it replaces.
    - cron: '7,37 * * * *'
  workflow_run:
    workflows: ['Deploy frontend (production)']
    types: [completed]
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Target URL (defaults to production)'
        required: false
        default: 'https://ezhalah-app.vercel.app'
      prove_filing:
        description: 'Also prove the incident-filing path end to end (files one synthetic P3 and closes it immediately)'
        required: false
        type: boolean
        default: false

env:
  # Robot pass (docs/ops/SCRAPE_GUARD.md): scripts/lib/robotPass.mjs sends it only to our own front door, so our
  # browser robots are never refused by the network guard or the bot checks. Empty on fork PRs = no pass, no change.
  EZ_GATE_SECRET: ${{ secrets.EZ_GATE_SECRET }}

# Never two pulses at once (a slow run must not stack on the next tick), but never cancel a running
# one either: a cancelled leg reads as neither pass nor fail, the dark-barrier shape.
concurrency:
  group: guardian-journeys
  cancel-in-progress: false

jobs:
  guardian:
    # The repo-wide runner switch (verify-runner-switch.ts): GitHub-hosted today. If EZ_RUNNER is ever
    # set, this 30-minute pulse moves to our server with everything else; watch that it does not queue
    # behind the scrapers there, or the pulse measures the runner instead of the site.
    runs-on: ${{ (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && vars.EZ_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 30
    # A deploy that FAILED shipped nothing; re-driving production would only measure the old bundle.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright + browser
        run: |
          npm i -D @playwright/test@^1.49
          npx playwright install --with-deps chromium
      - name: Drive the guardian journeys against production
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://ezhalah-app.vercel.app' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GUARDIAN_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node e2e/guardian/run.mjs

      # ── Failure→alert bridge (2026-09-04, issue #1349) ──────────────────────────────────────────
      # This job runs unattended: a red run notifies nobody, so it has to reach alert_event to reach
      # a human. One open P1 per workflow file (dedup workflow_failed:guardian-journeys.yml), and the
      # next green run resolves it. `always()` so a failing run still gets here.
      # scripts/verify-scheduled-checks-alert-on-failure.ts fails if this step is missing or names a
      # workflow file other than its own.
      # Explicit, never automatic. See e2e/guardian/prove-filing.mjs for why the one call that turns a
      # finding into owned work needs a deliberate round trip to be considered working at all.
      - name: Prove the incident-filing path end to end
        if: ${{ inputs.prove_filing }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node e2e/guardian/prove-filing.mjs

      - name: Bridge this run's result to alert_event
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: >-
          node scripts/ops/raise-workflow-alert.mjs
          --kind journey_live_check_failed
          --workflow guardian-journeys.yml
          --status ${{ job.status }}
          --run-url ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
