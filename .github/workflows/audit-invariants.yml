# Nightly production-audit invariants (2026-07-24). Runs the checks a daily audit was skipping:
#   1. every not-ready row has a verified reason bucket (0 unexplained)
#   2. the Awal scraper is still alive (price=0 is expected/by-design, not a failure)
#   3. the live AI Agent classifies a fixed Arabic query correctly and replies in Arabic
# Fails the run + logs a row to location_pipeline_alerts on any violation (same mechanism as
# location-placeholder-monitor.yml). See scripts/check_audit_invariants.py for the why of each check.
name: Audit invariants

on:
  schedule:
    # 04:40 UTC, NOT 03:00 — this job makes real paid DeepSeek calls and 01:00-04:00 UTC is
    # DeepSeek's PEAK window, where every token costs DOUBLE. Measured 2026-08-31: the account's
    # actual $/request came in ~20% above the blended model precisely because our automation ran
    # inside peak. 04:00-06:00 is off-peak; same test, half price. (owner ruling 2026-08-31)
    - cron: '40 4 * * *'   # nightly 04:40 UTC — off-peak
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install supabase python-dotenv certifi
      - name: Run production-audit invariants
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # SUPABASE_PUBLISHABLE_KEY intentionally omitted — the agent check falls back to the
          # hard-coded PUBLIC publishable key. Set this secret only if the key is ever rotated.
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/check_audit_invariants.py

      # ── Failure→alert bridge (2026-09-04, issue #1349) ──────────────────────────────────────────
      # This job runs unattended: a red run notifies nobody, so it has to reach alert_event to reach
      # a human. One open P1 per workflow file (dedup workflow_failed:audit-invariants.yml), and the next
      # green run resolves it. `always()` so a failing run still gets here.
      - name: Bridge this run's result to alert_event
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: >-
          node scripts/ops/raise-workflow-alert.mjs
          --kind data_live_check_failed
          --workflow audit-invariants.yml
          --status ${{ job.status }}
          --run-url ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
