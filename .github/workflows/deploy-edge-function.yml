# Supabase edge-function deploy — the missing half of the deploy story.
#
# WHY THIS EXISTS. deploy-frontend.yml ships the Vercel frontend and never touches
# supabase/functions/. Until this file, edge functions (agent, translit, delete-account,
# ingest-listings, alert-sink) had NO CI deploy path at all — they could only ship from a laptop
# holding a personal access token. That gap bit on 2026-08-29: a merged P0 fix for the agent
# (PR #1270 — the model alias was burning the whole token budget on hidden reasoning, 50% of live
# Arabic turns failing) sat green on main while production kept serving the broken version, because
# the only way to deploy it was a CLI command on the owner's machine.
#
# It is also the ONLY safe path for an agent session. The Supabase MCP deploy tool takes file
# content as an inline string, so an agent must retype the whole function — and
# supabase/functions/agent/index.ts is ~93KB containing invisible bidi format characters
# (U+200E/200F/202A/202E/061C in arNorm(), a raw U+0600 in two Arabic-detection regexes). One
# dropped invisible character silently breaks Arabic normalization on a live endpoint, and the MCP
# has no rollback. The CLI uploads real file bytes, so this workflow removes that whole risk class.
#
# WHAT IT IS NOT. Not auto-deploy-on-push, and it must never become that — same reasoning as
# deploy-frontend.yml. Dispatch-only: a human or an agent decides, on purpose, one function at a time.
#
# HOW IT STAYS SAFE.
#   - deploys ONLY from main, never a feature branch or a dirty tree
#   - refuses unless the checked-out commit == origin/main (no racing a fresh merge)
#   - npm test must pass first — the barriers (verify-agent-nonreasoning-model,
#     verify-agent-deepseek-only, verify-filter-never-calls-agent) gate the deploy
#   - `confirm: DEPLOY` exact literal for a real deploy; dry_run proves credentials without shipping
#   - --no-verify-jwt is REQUIRED: these functions do their own anon/publishable-key check, and
#     deploying with JWT verification on returns 401 to every user
#
# SETUP (one time): add a Supabase personal access token as the repo secret
# SUPABASE_ACCESS_TOKEN — https://supabase.com/dashboard/account/tokens

name: Deploy edge function (production)

on:
  workflow_dispatch:
    inputs:
      function:
        description: "Edge function to deploy"
        required: true
        type: choice
        options:
          - agent
          - translit
          - delete-account
          - devices
          - ingest-listings
          - alert-sink
      action:
        # DELETE exists so a throwaway function (e.g. the agent-diag probe used to diagnose the
        # 2026-08-29 outage) can be removed through the SAME gated path that created it, instead of
        # lingering in production because the only removal route was a laptop CLI.
        description: "deploy (default) or delete"
        required: false
        default: deploy
        type: choice
        options:
          - deploy
          - delete
      delete_function:
        description: "For action=delete ONLY: exact function name to remove (free text)"
        required: false
        default: ""
        type: string
      reason:
        description: "Why this deploy is needed (recorded in the run log)"
        required: true
        type: string
      confirm:
        description: "Type DEPLOY to confirm shipping main to production"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Verify token + function source, then STOP without deploying"
        required: false
        default: false
        type: boolean

# One edge deploy at a time.
concurrency:
  group: deploy-edge-function-production
  cancel-in-progress: false

jobs:
  deploy:
    name: supabase functions deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Assert we are on the tip of main
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          LOCAL="$(git rev-parse HEAD)"
          REMOTE="$(git rev-parse origin/main)"
          echo "HEAD       $LOCAL"
          echo "origin/main $REMOTE"
          if [ "$LOCAL" != "$REMOTE" ]; then
            echo "::error::HEAD is not origin/main. Refusing to deploy a stale checkout."
            exit 1
          fi

      - name: Assert the function source exists
        if: ${{ inputs.action != 'delete' }}
        run: |
          set -euo pipefail
          SRC="supabase/functions/${{ inputs.function }}/index.ts"
          if [ ! -f "$SRC" ]; then
            echo "::error::$SRC not found in the repo."
            exit 1
          fi
          echo "source:  $SRC"
          echo "bytes:   $(wc -c < "$SRC")"
          echo "md5:     $(md5sum "$SRC" | cut -d' ' -f1)"

      # A delete must never remove a function this repo still owns — that would silently orphan a
      # live endpoint whose source is sitting right there in supabase/functions/.
      - name: Guard the delete target
        if: ${{ inputs.action == 'delete' }}
        run: |
          set -euo pipefail
          TARGET="${{ inputs.delete_function }}"
          if [ -z "$TARGET" ]; then
            echo "::error::action=delete requires delete_function."
            exit 1
          fi
          if [ -d "supabase/functions/$TARGET" ]; then
            echo "::error::supabase/functions/$TARGET exists in this repo — refusing to delete a tracked function."
            echo "Delete its source in a PR first if it is genuinely being retired."
            exit 1
          fi
          echo "delete target: $TARGET (untracked in this repo — safe to remove)"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: npm ci
        if: ${{ inputs.action != 'delete' }}
        run: npm ci

      # WHY NOT `npm test` HERE.
      # The full suite includes LIVE-DATA oracles (verify-af-independent-oracle and friends) that
      # query production Postgres and compare live counts. Those are the right gate for a PR, and
      # main is already protected by them — full-verification-ci.yml runs the whole suite on every
      # PR, and the step above refuses to deploy anything that is not exactly origin/main.
      #
      # Re-running them at DEPLOY time adds no new signal and introduces a real hazard: a transient
      # DB hiccup or backend load would block an urgent production fix. The second dry run of this
      # workflow hit exactly that — verify-af-independent-oracle failed with `RPC=null` against a
      # healthy PostgREST count, minutes after the identical suite passed green on PR #1273.
      #
      # So the deploy gates on the DETERMINISTIC agent barriers: pure source assertions, no network,
      # no live data, no flake. They are the ones that catch the class of bug that actually ships
      # broken edge functions — verify-agent-nonreasoning-model.ts would have caught the config that
      # took the agent to a 50% failure rate on 2026-08-28.
      #
      # Glob-driven on purpose, matching the repo's "barriers run by existence" rule: a new
      # scripts/verify-agent-*.ts is picked up here automatically, with no edit to this file.
      - name: Agent barriers (deterministic gate)
        if: ${{ inputs.action != 'delete' }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # verify-edge-functions-parse.ts is listed explicitly (it is outside the verify-agent-*
          # glob): it parses every edge function AND rejects boot-fatal duplicate declarations. It
          # is the pre-deploy half of the post-deploy boot test below — on 2026-08-29 a missing
          # brace and then a duplicate `const t0` both reached main and the second one shipped a
          # function that bundled cleanly and then refused to boot.
          FILES=(scripts/verify-agent-*.ts scripts/verify-filter-never-calls-agent.ts scripts/verify-edge-functions-parse.ts)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::error::no agent barriers found — the glob is wrong, refusing to deploy blind."
            exit 1
          fi
          echo "Running ${#FILES[@]} deterministic agent barriers:"
          printf '  %s\n' "${FILES[@]}"
          for f in "${FILES[@]}"; do
            echo "── $f"
            node --experimental-strip-types --disable-warning=MODULE_TYPELESS_PACKAGE_JSON "$f"
          done
          echo "All ${#FILES[@]} agent barriers passed."

      - name: Verify Supabase credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN repo secret is not set."
            echo "Create one at https://supabase.com/dashboard/account/tokens and add it under"
            echo "Settings → Secrets and variables → Actions."
            exit 1
          fi
          # FORMAT check, not just presence. The first real deploy failed with "Invalid access token
          # format" AFTER a green dry run, because the stored value was the MASKED display text from
          # the dashboard token list (sbp_deb3••••515e) rather than the real code — the dashboard only
          # reveals the full token once, in the green box right after generating it. A presence-only
          # check cannot tell those apart, which made the dry run falsely reassuring. This can.
          # Real tokens are sbp_ followed by 40 lowercase hex characters.
          if ! printf '%s' "$SUPABASE_ACCESS_TOKEN" | grep -Eq '^sbp_[0-9a-f]{40}$'; then
            LEN=$(printf '%s' "$SUPABASE_ACCESS_TOKEN" | wc -c | tr -d ' ')
            echo "::error::SUPABASE_ACCESS_TOKEN is not a valid Supabase token (length $LEN, expected sbp_ + 40 hex chars)."
            echo ""
            echo "Most likely you copied the MASKED value from the token list (it contains • dots),"
            echo "or the value picked up a stray space or newline."
            echo ""
            echo "Fix: https://supabase.com/dashboard/account/tokens → Generate new token →"
            echo "click the COPY button in the green success box (the full value is shown once only),"
            echo "then update the secret at Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "SUPABASE_ACCESS_TOKEN present and correctly formatted."

      - name: Confirmation gate
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm }}" != "DEPLOY" ]; then
            echo "::error::confirm must be exactly DEPLOY for a real deploy (got '${{ inputs.confirm }}')."
            exit 1
          fi

      - name: Dry run — stop here
        if: ${{ inputs.dry_run }}
        run: |
          echo "dry_run=true — credentials and source verified, nothing deployed."

      # --no-verify-jwt is load-bearing: these functions gate on the anon/publishable key themselves.
      - name: Deploy
        if: ${{ !inputs.dry_run && inputs.action != 'delete' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes supabase@latest functions deploy "${{ inputs.function }}" \
            --project-ref aannarbkwcymrotzwdbo \
            --no-verify-jwt

      # ── POST-DEPLOY BOOT SMOKE TEST (blocking) ──────────────────────────────────────────────────
      # A SUCCESSFUL DEPLOY IS NOT A WORKING FUNCTION. Added 2026-08-29 after this exact sequence:
      # `supabase functions deploy` bundled cleanly and this workflow reported SUCCESS, while every
      # request to the deployed agent returned
      #   {"code":"BOOT_ERROR","message":"Function failed to start (please check logs)"}
      # because the module had two `const t0` in one scope. The bundler accepts it; the Deno worker
      # refuses to boot. The deploy was green and production was down.
      #
      # It stayed invisible on top of that: src/data/agent.ts falls back to its bundled offline
      # heuristic on ANY agent failure, so users see a working product with a dead AI. Nothing else
      # in this pipeline calls the deployed function, so nothing else can catch this class.
      #
      # This step makes the deployment verification depend on the function ACTUALLY RUNNING:
      # a real HTTP request, asserting a 2xx and a parseable JSON body. It fails the job on
      # BOOT_ERROR, on any 5xx, and on a body that is not the contract — so a broken deploy is a RED
      # run, not a green one. Pinned by scripts/verify-edge-deploy-boot-test.ts.
      - name: Post-deploy boot smoke test (blocking)
        if: ${{ !inputs.dry_run && inputs.action != 'delete' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # EXPO_PUBLIC_SUPABASE_ANON_KEY is the key that actually EXISTS in this repo's Actions
          # secrets. (SUPABASE_PUBLISHABLE_KEY is referenced elsewhere in .github/workflows but is
          # NOT configured — it resolves to an empty string. Do not use it here.)
          ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -uo pipefail
          FN="${{ inputs.function }}"
          URL="${SUPABASE_URL%/}/functions/v1/${FN}"
          # Public, already shipped in the app bundle — the agent's own soft gate accepts it. Used
          # only if the anon secret is unavailable, so this gate can never be skipped for want of a
          # credential. Either way an auth rejection is a 4xx, which still PROVES the worker booted.
          # Try the PUBLISHABLE key first: it is what these functions' own soft gate accepts, so the
          # probe reaches the real handler instead of stopping at auth. (First live run of this gate
          # used the anon secret and got HTTP 401 — that still proves the worker booted, which is
          # what this gate is for, but a 401 short-circuits before the handler and would not catch
          # "boots fine, then 500s on every real request".) The publishable key is public by design:
          # it is hardcoded in the function source and shipped in the app bundle.
          KEYS=("sb_publishable_vXzwxdpfrzmbwtbR5aXcKA_cMUO8hVB" "${ANON_KEY:-}")

          # Each function's own minimal, side-effect-free request. An unknown function still gets
          # booted and must not return BOOT_ERROR/5xx — a 4xx from its own input validation proves
          # the worker started, which is what this gate is about.
          case "$FN" in
            agent)    BODY='{"text":"شقة للايجار في الرياض","locale":"ar","loggedIn":false,"order":true,"history":[]}' ;;
            translit) BODY='{"text":"Riyadh"}' ;;
            *)        BODY='{}' ;;
          esac

          # Cold start + propagation: retry a few times before declaring failure, so a slow first
          # boot is not reported as a broken deploy.
          for attempt in 1 2 3 4 5; do
            for KEY in "${KEYS[@]}"; do
              [ -z "$KEY" ] && continue
              CODE=$(curl -s -o /tmp/boot.json -w '%{http_code}' --max-time 45 -X POST "$URL" \
                -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
                -H 'content-type: application/json' -d "$BODY" || echo 000)
              echo "attempt $attempt (key ${KEY:0:12}...) → HTTP $CODE"
              BOOT_ERR=$(grep -c 'BOOT_ERROR' /tmp/boot.json 2>/dev/null || true)
              # A 2xx means we exercised the REAL handler end to end - stop here.
              if [ "$CODE" -ge 200 ] && [ "$CODE" -lt 300 ] && [ "${BOOT_ERR:-0}" -eq 0 ]; then
                break 2
              fi
            done
            sleep 10
          done

          # A 4xx still proves the worker STARTED (the function itself produced that response), so it
          # passes the gate - but say plainly that the handler was not exercised, instead of letting
          # a green tick imply more than was tested.
          if [ "$CODE" -ge 400 ] && [ "$CODE" -lt 500 ]; then
            echo "::warning::$FN booted (HTTP $CODE) but the request was rejected before the handler ran - boot is proven, the handler path is NOT."
          fi

          echo "--- response (first 400 bytes) ---"
          head -c 400 /tmp/boot.json || true
          echo

          FAIL=""
          if grep -q 'BOOT_ERROR' /tmp/boot.json 2>/dev/null; then
            FAIL="the worker could not START (BOOT_ERROR) — the bundle deployed but the module does not initialize"
          elif [ "$CODE" = "000" ]; then
            FAIL="no HTTP response (timeout / DNS / TLS)"
          elif [ "$CODE" -ge 500 ]; then
            FAIL="HTTP $CODE — the function is failing on every request"
          elif ! python3 -c 'import json,sys; json.load(open("/tmp/boot.json"))' 2>/dev/null; then
            FAIL="the response body is not JSON — the function is not answering its contract"
          fi

          if [ -n "$FAIL" ]; then
            {
              echo "### 🚨 POST-DEPLOY BOOT TEST FAILED — the deployed function does not run"
              echo ""
              echo "**\`$FN\` was deployed, and it is NOT working in production.**"
              echo ""
              echo "- $FAIL"
              echo "- Users will NOT see an error: the client falls back to its bundled offline heuristic, so the product looks healthy while the AI is dead."
              echo ""
              echo "Check the Supabase function logs for \`worker boot error\`. A duplicate declaration or a"
              echo "module-scope throw bundles fine and still refuses to boot."
              echo "Roll back by redeploying the previous good commit of \`supabase/functions/$FN\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Post-deploy boot test FAILED for $FN — $FAIL"
            exit 1
          fi

          echo "✓ $FN booted and answered (HTTP $CODE, JSON body)"
          {
            echo "### ✅ Post-deploy boot test passed"
            echo "\`$FN\` answered a real request with HTTP $CODE and a JSON body — the worker is running."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete
        if: ${{ !inputs.dry_run && inputs.action == 'delete' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes supabase@latest functions delete "${{ inputs.delete_function }}" \
            --project-ref aannarbkwcymrotzwdbo

      - name: Report
        if: ${{ !inputs.dry_run && inputs.action != 'delete' }}
        run: |
          echo "Deployed ${{ inputs.function }} to aannarbkwcymrotzwdbo."
          echo "Reason: ${{ inputs.reason }}"
          echo "Commit: $(git rev-parse HEAD)"
