# Owner 2026-11-01 («fully automate those engineers»): a merged app fix reaches customers without a person.
# This file only DISPATCHES deploy-frontend.yml, so the deploy lock, the preflight and the 10% canary (it rolls back
# by itself when a guardian journey regresses) all still decide. It runs once for a given main commit, so a failed
# deploy is not retried until something new lands, and it stops and goes red after 3 failed deploys in a row.
# 2026-11-06 (🔧): the stop RE-ARMS after a 3-hour cool-off. It used to be permanent: on 11-06 three deploys at
# 07:09-07:35 UTC were refused by the drift gate (an unmirrored migration, nothing shipped), the gate cleared later,
# and this robot still refused every hourly pass for 13+ hours because nothing could ever produce a 4th run — a
# breaker that only a person can reset is a deadlock, not a guard. Three hours after the NEWEST failure it dispatches ONE deploy for
# the new main commit (the «already tried» rule above keeps it to one per commit); every gate in deploy-frontend.yml
# (lock, preflight, drift, 10% canary with auto-rollback) still decides. Guard: scripts/verify-auto-deploy-breaker-rearms.ts.
name: Auto-deploy merged app fixes

on:
  schedule:
    - cron: '40 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: auto-deploy-merged-fixes
  cancel-in-progress: false

env:
  # Secret handshake (docs/ops/SCRAPE_GUARD.md): the alert bridge below talks to our own database.
  EZ_GATE_SECRET: ${{ secrets.EZ_GATE_SECRET }}

jobs:
  dispatch:
    # ALWAYS ON GITHUB (🔧 2026-11-14, measured): the hourly canary deploy queued 5.6 h on the own server (run 43572437722),
    # so no merged src/ fix reached a customer. Listed in HOSTED_ONLY.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Dispatch a deploy when app files changed since the last good one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs=$(gh run list -w deploy-frontend.yml --branch main --limit 30 --json status,conclusion,headSha,createdAt)
          head=$(git rev-parse HEAD)
          if [ "$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")" != 0 ]; then
            echo "A deploy is running — next pass."; exit 0
          fi
          if [ "$(jq --arg h "$head" '[.[] | select(.headSha == $h)] | length' <<<"$runs")" != 0 ]; then
            echo "$head was already tried."; exit 0
          fi
          good=$(jq -r 'first(.[] | select(.conclusion == "success") | .headSha) // ""' <<<"$runs")
          [ -n "$good" ] || { echo "::error::no successful deploy in the last 30 runs"; exit 1; }
          changed=$(git diff --name-only "$good" "$head" -- src public assets api middleware.ts app.json babel.config.js metro.config.js package.json package-lock.json vercel.json)
          [ -n "$changed" ] || { echo "No app files changed since $good."; exit 0; }
          cooloff=$(date -u -d '3 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          if [ "$(jq --arg c "$cooloff" '([limit(3; .[])] | all(.conclusion == "failure")) and (.[0].createdAt > $c)' <<<"$runs")" = true ]; then
            echo "::error::the last 3 deploys failed in a row, the newest under 3 hours ago — not dispatching another (re-arms 3 h after the newest failure)."; exit 1
          fi
          printf '%s\n' "$changed"
          gh workflow run deploy-frontend.yml --ref main -f confirm=DEPLOY -f "reason=auto: app files changed since ${good:0:7}"

      # Unattended, so a red run must reach alert_event (same bridge as engineer-automerge.yml).
      - name: Bridge this run's result to alert_event
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: >-
          node scripts/ops/raise-workflow-alert.mjs
          --kind barrier_check_failed
          --workflow auto-deploy-merged-fixes.yml
          --status ${{ job.status }}
          --run-url ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
