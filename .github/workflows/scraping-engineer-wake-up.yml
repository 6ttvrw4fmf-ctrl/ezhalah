# Wakes the ⚡ Scraping Engineer the moment a crawl fails (owner, 2026-09-27: "wakes up instantly
# when one fails"), instead of leaving the site broken until the nightly sweep.
#
# GitHub event triggers for Claude Code routines only cover pull requests and releases, so this uses
# the documented routine fire endpoint instead (platform.claude.com/docs/en/api/claude-code/routines-fire):
# a per-routine token, generated by the owner in claude.ai, stored as two repo secrets:
#   SCRAPING_ENGINEER_FIRE_URL    https://api.anthropic.com/v1/claude_code/routines/<trig_…>/fire
#   SCRAPING_ENGINEER_FIRE_TOKEN  sk-ant-oat01-…  (can ONLY fire this one routine; no read access)
# Until both exist this job does nothing and stays green. It wakes the engineer only for NEW
# failures (scripts/engineer-wake.sh): a site that already failed in the previous run is left to the
# nightly sweep, so a site that stays down, or the engineer's own re-runs, can't keep re-waking it.
#
# One job for every crawl workflow, rather than a step pasted into fifteen files. Loops are bounded
# twice: the engineer tries a site at most 3 times a day (docs/ops/SCRAPING_ENGINEER.md rule 8), and
# the endpoint accepts at most 30 fires per routine per hour.
name: Scraping Engineer wake-up

on:
  workflow_run:
    workflows:
      - Small sources sync
      - Aqar residential sweep
      - Aqar commercial sweep
      - Aqar residential deep fill
      - Aqar commercial fill
      - Aqar Monthly sync
      - Wasalt residential sweep
      - Wasalt commercial sweep
      - Wasalt residential deep fill
      - Wasalt commercial fill
      - Wasalt enrich
      - Gathern sync
      - Deal App sharded crawl
      - Muktamel sync
      - Muktamel sharded crawl
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  wake:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/engineer-wake.sh
          sparse-checkout-cone-mode: false
      # Wakes only for NEW failures (jobs that did not fail in the previous run of the same
      # workflow). A repeat of a known failure is left to the nightly run. See the script.
      - name: Fire the Scraping Engineer (new failures only)
        env:
          FIRE_URL: ${{ secrets.SCRAPING_ENGINEER_FIRE_URL }}
          FIRE_TOKEN: ${{ secrets.SCRAPING_ENGINEER_FIRE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          WF_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          ENGINEER: Scraping Engineer
          KIND: crawl
          SCOPE: "Handle only the sites in those NEW failed jobs."
        run: bash scripts/engineer-wake.sh
