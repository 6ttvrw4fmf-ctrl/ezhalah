# Weekly Wasalt retention cleanup via the unified engine (scrapers/common/cleanup.py).
#
# MIGRATED 2026-08-22 (owner-directed safety audit) from the legacy scrapers/aqar/cleanup.py (shared
# with aqar), which hard-deleted on missing_count>=3 + 30-day age ALONE — no final live re-check
# before deleting, no anomaly/spike circuit breaker, no fraction-of-platform guard, no per-row audit
# trail. Same filename, same pg_cron schedule (gh-wasalt-cleanup, Sun 02:30 UTC), same 30-day/
# 3-strike thresholds — this only adds the safety layers the legacy script never had. wasalt has been
# registered in the unified engine with a working dead-marker check since 2026-07-27; this migration
# just turns it on (platform_retention_policy.enabled, see the paired migration).
#
# Honors the wasalt platform_retention_policy row. Deletes a listing ONLY after re-fetching its real
# wasalt URL (through the same proxy the liveness sweep uses) and confirming a dead marker
# (404/410/"ad removed" text) — a live 200 is never deleted, it is reactivated (self-heal). A run
# whose eligible population spikes past the anomaly or fraction-of-platform threshold ABORTS and
# deletes nothing, raising a P1 (mon_detect_deletion_spike). This is the SAME circuit breaker that
# would catch a wasalt proxy-block event before it could delete anything — see cleanup.py's
# eligible_total > anomaly threshold gate.
#
# REQUIRED FIRST RUN: dispatch manually with dry_run=true and review the report BEFORE letting the
# next scheduled Sunday run go live. Do not skip this — see the PR this workflow shipped in.
name: Wasalt cleanup

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = probe + classify + report, delete NOTHING (use this before any first real run)"
        required: false
        # MUST default to "false": the weekly pg_cron trigger (gh-wasalt-cleanup) dispatches with NO
        # inputs, so the default is what the scheduled job gets. Defaulting to "true" here would
        # silently turn the real weekly cleanup into a no-op.
        default: "false"

concurrency:
  group: wasalt-cleanup
  cancel-in-progress: false

env:
  # Robot pass (docs/ops/SCRAPE_GUARD.md): scripts/lib/robotPass.mjs sends it only to our own front door, so our
  # browser robots are never refused by the network guard or the bot checks. Empty on fork PRs = no pass, no change.
  EZ_GATE_SECRET: ${{ secrets.EZ_GATE_SECRET }}

jobs:
  cleanup:
    runs-on: ${{ (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && vars.EZ_RUNNER) || 'ubuntu-latest' }}
    # 180 min (was 60): the re-check drives a real browser per candidate (~15-20s each through the
    # Cloudflare path), so a drain batch of ~500 needs ~2.5h. 60 min cancelled the first drain
    # dry-run mid-recheck (2026-09-20). Still far under GitHub's 6h ceiling.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: scrapers/requirements.txt
      - name: Install scraper dependencies
        run: pip install -r scrapers/requirements.txt
      # Cloudflare path (issue #1019): the cleanup RE-CHECK re-fetches each candidate's real wasalt
      # URL, and wasalt.sa null-routes the curl_cffi+proxy shape — so without a real browser every
      # recheck returns 403/timeout ("unknown"), nothing dead is ever deleted, and the run's
      # inconclusive freeze trips. cleanup.py routes wasalt through scrapers/wasalt/browser.py when
      # WASALT_BROWSER=1, exactly as run.py (#3129), enrich_ar (#3140) and liveness (#3166) do.
      - name: Install Chromium for the Cloudflare path
        run: |
          # apt behind «--with-deps» flaked on 2026-11-11 (exit 100); three tries, a mirror blip never fails a run.
          ok=0; for i in 1 2; do timeout 240 python -m playwright install --with-deps chromium && { ok=1; break; }; echo "playwright install --with-deps failed or hung on apt (try $i)"; sleep 15; done
          # 2026-11-11 15:0x: three tries still failed (the apt mirror of the runner image was down) — the Ubuntu runner image already
          # carries the browser libraries, so the browser itself is installed without apt and the run goes on; a missing lib fails the launch, visibly.
          [ "$ok" = 1 ] || { echo "apt still failing — installing the browser without --with-deps"; python -m playwright install chromium; }
      - name: Run wasalt cleanup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WASALT_PROXY_URL: ${{ secrets.WASALT_PROXY_URL }}
          WASALT_BROWSER: "1"
        run: |
          # headless=False clears the challenge; the runner has no display, so xvfb-run supplies one.
          exec xvfb-run -a python -m scrapers.common.cleanup --platform wasalt \
            ${{ inputs.dry_run == 'true' && '--dry-run' || '' }}
