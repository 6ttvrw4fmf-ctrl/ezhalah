# Wasalt proxy failure-layer discriminator (owner-requested, 2026-08-24) -- see GitHub issue
# #1019 and scrapers/wasalt/diagnose_proxy.py's module docstring for the full context.
#
# ONE request per stage, against ONE real listing, through the SAME WASALT_PROXY_URL every other
# wasalt workflow uses. Diagnosis only -- no database writes, no burst. Do NOT add a schedule to
# this workflow; it is dispatched manually/on demand only.

name: Wasalt proxy diagnostic

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    name: Diagnose wasalt proxy failure layer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: scrapers/requirements.txt
      - name: Install scraper dependencies
        run: pip install -r scrapers/requirements.txt
      - name: Run the layer discriminator
        env:
          WASALT_PROXY_URL: ${{ secrets.WASALT_PROXY_URL }}
        run: exec python -m scrapers.wasalt.diagnose_proxy
