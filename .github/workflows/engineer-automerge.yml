# Owner decision 2026-10-18 («yes turn it on»): a night engineer's fix that touches ONLY the scraping robots
# (every changed file under scrapers/) lands the same night without waiting for a person. It goes through
# THE sanctioned merge gate (scripts/safe-pr-merge.ts — verify-merge-gate-transport.ts keeps it the only
# door): the gate re-reads the PR right before merging and refuses unless every required check on main is
# exactly SUCCESS, the branch is up to date and mergeable, and the file list still matches. Anything else —
# app screens (src/), the database (supabase/), workflows (.github/), docs, the agent — still waits for a
# person. Drafts and forks are never considered. A BEHIND branch is the engineer's to update (its prompt).
name: Engineer auto-merge (scrapers only)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: engineer-automerge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Scrapers-only claude/* PRs → the sanctioned gate (it refuses anything not green)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          prs=$(gh pr list --repo "$REPO" --state open --limit 50 \
                  --json number,headRefName,isDraft,isCrossRepository \
                  -q '.[] | select((.headRefName|startswith("claude/")) and (.isDraft|not) and (.isCrossRepository|not)) | .number')
          for pr in $prs; do
            files=$(gh pr view "$pr" --repo "$REPO" --json files -q '.files[].path')
            outside=$(printf '%s\n' "$files" | grep -v '^scrapers/' || true)
            if [ -z "$files" ] || [ -n "$outside" ]; then
              echo "#$pr: not scrapers-only — left for a person"; continue
            fi
            echo "#$pr: scrapers-only → safe-pr-merge.ts"
            node --experimental-strip-types --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/safe-pr-merge.ts "$pr" \
              --expect-files "$(printf '%s\n' "$files" | paste -sd, -)" || echo "#$pr: gate refused (not green / behind / moved) — next pass"
          done
