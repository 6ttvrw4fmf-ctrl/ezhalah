# Wasalt DIRECT revisit — aqar's mechanism (owner 2026-09-28: «every website as strong as Aqar»).
# Each active wasalt row's OWN page is read through the real browser + Saudi proxy (the only
# transport wasalt answers since Cloudflare, 2026-08-17): live → last_verified_alive_at, dead → one
# direct strike, the 3rd hides it; known-live controls open and close every shard and a collapse
# guard stops a broken one (scrapers/wasalt/liveness.py::run_enforce). Rows are read never-verified
# first, so a shard cut short by its budget read the rows that matter most.
#
# Until 2026-09-29 this ran scrapers.aqar.liveness over curl_cffi, the transport Cloudflare blocks:
# every read was UNKNOWN. That, and enum-strike reading only enum-absent candidates, is why 61,928 of
# 62,170 live wasalt ads had never been verified.
#
# NO SCHEDULE, deliberately: a daily read of every live ad is ~31k browser reads/day through the
# METERED proxy. That is a proxy-cost decision for the owner (LIFECYCLE_ENGINEER.md hard rule 8).
# Measured cost per read is in wasalt_liveness_runs.notes (s_per_check, kb_per_check).
#
# --max-seconds stays under 50 min: every hide is audited against a GONE probe from the hour before it.

name: Wasalt liveness

on:
  workflow_dispatch:
    inputs:
      report_only:
        description: "Shadow: read and report, write nothing but the run row"
        type: boolean
        default: true
      limit:
        description: "Rows per shard (never-verified first)"
        type: string
        default: "100"
      max_parallel:
        description: "Shards at once (each is one browser on the shared proxy; §5.3: keep it low)"
        type: string
        default: "2"

concurrency:
  group: wasalt-liveness
  cancel-in-progress: false

jobs:
  liveness:
    name: Direct revisit shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: scrapers/requirements.txt
      - name: Install scraper dependencies
        run: pip install -r scrapers/requirements.txt
      - name: Install Chromium for the Cloudflare path
        run: python -m playwright install --with-deps chromium
      - name: Direct revisit shard ${{ matrix.shard }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WASALT_PROXY_URL: ${{ secrets.WASALT_PROXY_URL }}
          WASALT_BROWSER: "1"
          SCRAPE_MIN_INTERVAL: "0.3"
        run: |
          exec xvfb-run -a python -m scrapers.wasalt.liveness \
            --mode enforce --shards 8 --shard ${{ matrix.shard }} \
            --limit ${{ inputs.limit }} --workers 1 --max-seconds 3000 \
            ${{ inputs.report_only && '--report-only' || '' }}

  # ── Failure→alert bridge (2026-09-04, issue #1349) ──────────────────────────────────────────────
  # Its OWN job, not a step in the matrix: with a matrix, a per-leg step would let a green shard
  # resolve the alert a red sibling had just raised. `needs` collapses every leg into one verdict,
  # so this workflow raises and heals exactly once per run. A skipped need (a downstream job the
  # failure gated off) is not itself a failure — the failing leg already reports one.
  alert:
    needs: [liveness]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Bridge this run's result to alert_event
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: >-
          node scripts/ops/raise-workflow-alert.mjs
          --kind ingestion_check_failed
          --workflow wasalt-liveness.yml
          --status ${{ contains(needs.*.result, 'failure') && 'failure' || (contains(needs.*.result, 'cancelled') && 'cancelled' || 'success') }}
          --run-url ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
