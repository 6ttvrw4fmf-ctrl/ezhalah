# Aqar COMMERCIAL deep-fill — bulk loads commercial listings for every city in parallel.
#
# One GitHub machine per city (own IP), all cities at once. Each city scrapes all 10 commercial
# types (shop, office, warehouse, workshop, factory, hotel, gas_station, health_center, farm,
# commercial_building) × rent+buy and upserts into aqar_commercial_listings.
#
# SCHEDULED (2026-10-02) by pg_cron `gh-aqar-commercial-fill` (sql/proposed/aqar_paced_fill.sql), twice a
# day, 6 h away from the residential deep fill. Until then the last full commercial fill had run on
# 2026-06-20 and only the 3-page / 12-city commercial sweep kept the table alive. pg_cron dispatches with
# NO inputs, so the defaults below ARE the schedule: every page the source has, at most `new_budget` NEW
# rows per run shared by all city jobs (scrapers/aqar/paced_fill.py), held ads re-read once
# `refresh_after_days` old.
#
# HOW TO RUN BY HAND: Actions tab → "Aqar commercial fill" → Run workflow.
# Leave city blank for ALL cities in parallel, or name one city.

name: Aqar commercial fill

on:
  workflow_dispatch:
    inputs:
      city:
        description: "City to fill (leave blank for ALL cities in parallel)"
        required: false
        default: ""
      pages:
        description: "Max pages per slice (0 = every page the source has — the default)"
        required: false
        default: "0"
      limit:
        description: "Max listings per slice (0 = no cap — the default)"
        required: false
        default: "0"
      new_budget:
        description: "Max NEW rows this whole run may add, shared by all city jobs (default 25000)"
        required: false
        default: "25000"
      refresh_after_days:
        description: "Re-read a held ad once its last capture is this many days old (default 6)"
        required: false
        default: "6"

# Two runs must never overlap: each run's new-row budget is only a bound if runs do not stack.
concurrency:
  group: aqar-commercial-fill
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      cities: ${{ steps.pick.outputs.cities }}
    steps:
      - id: pick
        run: |
          if [ -n "${{ github.event.inputs.city }}" ]; then
            echo "cities=[\"${{ github.event.inputs.city }}\"]" >> $GITHUB_OUTPUT
          else
            echo 'cities=["riyadh","al_kharj","al_majmaah","dawadmi","al_zulfi","afif","al_quwayiyah","shaqra","diriyah","al_muzahimiyah","thadiq","hawtat_bani_tamim","al_ghat","rumah","al_dalam","al_hariq","al_sulayyil","al_hayathim","jeddah","mecca","taif","rabigh","al_qunfudhah","kaec","thuwal","al_jumum","al_kamil","al_lith","turabah","raniyah","al_khurma","medina","yanbu","al_ula","badr","al_hanakiyah","umluj","khaybar","mahd_adh_dhahab","buraidah","unaizah","al_rass","al_bukayriyah","al_mithnab","al_badai","riyadh_al_khabra","al_nabhaniyah","al_shamasiyah","dammam","khobar","dhahran","hofuf","jubail","qatif","hafar_al_batin","ras_tanura","abqaiq","al_nairyah","khafji","sayhat","safwa","tarout","anak","al_uyun","abha","khamis_mushait","bisha","mahayel","ahad_rafidah","al_majardah","balsamar","tathlith","tabuk","duba","al_wajh","tayma","hail","baqaa","al_ghazalah","al_shanan","arar","rafha","turaif","jazan","sabya","abu_arish","samtah","baysh","ahad_al_masarihah","najran","sharurah","al_baha","sakaka","qurayyat","dawmat_al_jandal"]' >> $GITHUB_OUTPUT
          fi

  commercial-fill:
    needs: setup
    name: Commercial ${{ matrix.city }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 10   # leave runner slots for the sweeps and liveness jobs pg_cron dispatches meanwhile
      matrix:
        city: ${{ fromJson(needs.setup.outputs.cities) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: scrapers/requirements.txt

      - name: Install scraper dependencies
        run: pip install -r scrapers/requirements.txt

      - name: Commercial fill ${{ matrix.city }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPE_WORKERS: "16"
          SCRAPE_MIN_INTERVAL: "0.10"
          # ONE key per workflow run: every city job draws new rows from the same budget row.
          FILL_RUN_KEY: aqar-commercial-fill:${{ github.run_id }}
        run: |
          exec python -m scrapers.aqar.run_commercial \
            --all-commercial \
            --city ${{ matrix.city }} \
            --pages ${{ github.event.inputs.pages || 0 }} \
            --limit ${{ github.event.inputs.limit || 0 }} \
            --new-budget ${{ github.event.inputs.new_budget || 25000 }} \
            --refresh-after-days ${{ github.event.inputs.refresh_after_days || 6 }}
