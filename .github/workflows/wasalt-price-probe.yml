# Read-only wasalt price-source probe. Prints what wasalt publishes for the given listing URLs so a
# suspected-bad price can be adjudicated against the SOURCE instead of against arithmetic.
#
# No database credentials are passed to this job on purpose: the script cannot write, and cannot
# read, the rows it is being used to judge. Diagnosis only. Do NOT add a schedule.
name: Wasalt price probe

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Space-separated wasalt listing URLs to read"
        required: true
        type: string

env:
  # Robot pass (docs/ops/SCRAPE_GUARD.md): scripts/lib/robotPass.mjs sends it only to our own front door, so our
  # browser robots are never refused by the network guard or the bot checks. Empty on fork PRs = no pass, no change.
  EZ_GATE_SECRET: ${{ secrets.EZ_GATE_SECRET }}

jobs:
  probe:
    name: Read the published price
    runs-on: ${{ (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && vars.EZ_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: scrapers/requirements.txt
      - name: Install scraper dependencies
        run: pip install -r scrapers/requirements.txt
      - name: Install Chromium
        run: |
          # apt behind «--with-deps» flaked on 2026-11-11 (exit 100); three tries, a mirror blip never fails a run.
          ok=0; for i in 1 2 3; do python -m playwright install --with-deps chromium && { ok=1; break; }; echo "playwright install --with-deps failed (try $i)"; sleep 15; done
          # 2026-11-11 15:0x: three tries still failed (the apt mirror of the runner image was down) — the Ubuntu runner image already
          # carries the browser libraries, so the browser itself is installed without apt and the run goes on; a missing lib fails the launch, visibly.
          [ "$ok" = 1 ] || { echo "apt still failing — installing the browser without --with-deps"; python -m playwright install chromium; }
      - name: Prove the payload walk picks the right number
        run: exec python -m scrapers.wasalt.probe_price --selftest

      - name: Probe
        env:
          WASALT_PROXY_URL: ${{ secrets.WASALT_PROXY_URL }}
          WASALT_BROWSER: "1"
        # Deliberately unquoted: the input is a space-separated URL list, one argv entry each.
        run: exec python -m scrapers.wasalt.probe_price ${{ inputs.urls }}
