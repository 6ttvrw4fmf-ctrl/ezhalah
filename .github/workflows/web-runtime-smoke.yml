# Does the built app actually RUN? Builds the web bundle and drives the real primary journey
# (تصفية → «بحث» → results, then hard-refresh → reopen «تصفية») in headless Chromium.
#
# Exists because on 2026-08-15 a TypeScript type error in src/app/agent.tsx shipped to production
# and blanked the page on «بحث» — search dead app-wide — with every gate green: `npm test` is a
# source-grep/logic suite that never renders the app, the repo has no typecheck, and safe-deploy's
# post-deploy smoke test calls the search RPC directly (which stayed HTTP 200 while the UI was dead).
# See scripts/verify-web-runtime-smoke.mjs for the full story and its three-way proof.
#
# 2026-08-23 (PR #1012): the E/F/H "resubmit after Stop returns the EXACT SAME count" checks were
# re-oracled to compare the SERIALIZED SEARCH REQUEST (key-order-insensitive signature) instead of
# the landed count. Root cause of the false failures: both counts were live production reads taken
# minutes apart, so any run straddling a data-refresh tick (MV refresh pg_cron jobid 17 at :00,
# sync_search_listings_ar jobid 28 at :14) saw the inventory legitimately move and failed with the
# query perfectly intact — observed baseline=347 → resubmit=1940 on an untouched filter; 6146bc0's
# main run failed at 22:08+ while the 22:00 runs passed, and two PR-branch runs in the same window
# failed identically. The request oracle is exactly as strict about what Stop must preserve and
# immune to data movement; the landed count stays only as a finite-liveness check. Full story in
# the ORACLE CHANGE comment at the [E] resubmit check in the script.
#
# Kept OUT of `npm test` (that suite is hermetic and runs in seconds); since 2026-10-23 it is its OWN
# required status check instead, running on every PR — see the `on:` note below.
name: Web runtime smoke

on:
  # EVERY PR, no path filter (owner 2026-10-23, step 1 of the self-healing proposal): this is the one
  # check that renders the app, and it is becoming a REQUIRED status check on main. A path filter on
  # a required check stalls every PR that does not match it (the check never reports), and the two
  # 2026-10-23 app-screen bugs showed that "which paths can break a screen" is not a list anyone keeps
  # right. 8 minutes on a PR is the price of never shipping a blank page again.
  pull_request:
  # The queued merge commit must carry the check too, or the merge queue waits forever (owner 2026-10-22).
  merge_group:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/verify-web-runtime-smoke.mjs'
      - 'scripts/verify-web-scroll-smooth.mjs'
  workflow_dispatch:
  # SCHEDULED 2026-09-04. This is the richest browser suite in the repo — journeys A-J0 over both
  # viewports, ~52 product assertions — and it had no schedule at all: it ran only on a PR or push
  # that touched src/**. So a regression that arrives any OTHER way (a dependency bump, an Expo or
  # react-native-web change, a Supabase RPC contract shift, a data shape the journeys did not expect)
  # was invisible to it until someone happened to edit src/. The 74-agent coverage audit
  # (wf_01c03538-2c0) called this out as free coverage, and it is: the runner already exists, the
  # build already works, nothing new had to be written. 04:10 UTC sits clear of guardian-journeys
  # (05:40) and ui-parity (05:10) so the browser jobs do not contend for the runner.
  schedule:
    - cron: '10 4 * * *'

concurrency:
  group: web-runtime-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  # Robot pass (docs/ops/SCRAPE_GUARD.md): scripts/lib/robotPass.mjs sends it only to our own front door, so our
  # browser robots are never refused by the network guard or the bot checks. Empty on fork PRs = no pass, no change.
  EZ_GATE_SECRET: ${{ secrets.EZ_GATE_SECRET }}

jobs:
  smoke:
    name: built app runs («بحث» → results → refresh)
    # ALWAYS ON GITHUB (owner 2026-11-13, «we can split for now»): its phone-speed robots drive Apple's map at a 4× slowed
    # CPU, and on our own server the page froze ~10 s whenever all 8 helpers were busy (passes on a quiet server and on
    # GitHub). Listed in HOSTED_ONLY in scripts/verify-runner-switch.ts; every other workflow follows the switch.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for Playwright
        # apt went unreachable on 2026-11-11 (12:24 UTC on, «Temporary failure resolving archive.ubuntu.com») and this
        # REQUIRED check failed on every PR. Retry; if apt is still down, install Chromium alone (the runner image carries
        # its libraries) and prove it launches — a browser that cannot start still fails this check.
        run: |
          ok=""
          for i in 1 2 3; do
            if timeout 240 npx playwright install --with-deps chromium; then ok=1; break; fi
            echo "playwright --with-deps failed (attempt $i)"; sleep 20
          done
          if [ -z "$ok" ]; then
            echo "::warning::apt unreachable after 3 tries — installing Chromium without system packages"
            npx playwright install chromium
          fi
          node -e "require('@playwright/test').chromium.launch().then((b) => b.close()).then(() => console.log('chromium launches'), (e) => { console.error(e); process.exit(1); })"

      - name: Build the web bundle
        # EXPO_PUBLIC_* are CLIENT-PUBLIC by definition — they are inlined into the browser bundle
        # and served to every visitor, so the anon key below is not a secret (it is the same value
        # already visible in any production page source, and RLS is what actually protects the data).
        # NEVER put the service-role key here. Repo secrets take precedence when configured.
        #
        # This step deliberately does NOT read scripts/safe-deploy.sh: any workflow mentioning it is
        # classified as a production deploy entrypoint by scripts/verify-deploy-workflow-guard.ts and
        # must then carry the full manual-dispatch + DEPLOY-confirmation gating. This workflow does
        # not deploy anything, and must not look like it does.
        #
        # Without these the Supabase client builds as null and every search dies — itself the
        # 2026-07-10 P0 signature, which this smoke test would then (correctly) catch.
        env:
          SECRET_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SECRET_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}
        run: |
          set -euo pipefail
          PUBLIC_URL="https://aannarbkwcymrotzwdbo.supabase.co"
          PUBLIC_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFhbm5hcmJrd2N5bXJvdHp3ZGJvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0MDgxMDAsImV4cCI6MjA5NTk4NDEwMH0.Z-GhSpan6otYWkc8sU43Dw5PT5T_VBUMr0IDZShCQw0"
          export EXPO_PUBLIC_SUPABASE_URL="${SECRET_URL:-$PUBLIC_URL}"
          export EXPO_PUBLIC_SUPABASE_KEY="${SECRET_KEY:-$PUBLIC_KEY}"
          npx expo export --platform web

      # ALWAYS FAST (owner 2026-10-27): the first download stays under its size budget. scripts/web-bundle-budget.mjs
      - name: Web bundle size budget
        run: node scripts/web-bundle-budget.mjs dist

      - name: Drive the built app in a real browser
        run: node scripts/verify-web-runtime-smoke.mjs

      # THE SCROLL ROBOT (owner 2026-10-24: laptop scrolling was slow — «let's make a robot that checks this»). Same
      # build, same Chromium, a laptop-size screen: counts the never-ending animations at rest / mid-scroll (page one
      # and a 500-card list) and times a real wheel-scroll against the same page with its animations off. See the
      # header of the script and src/lib/scrollCalm.ts. One search + two taps of «عرض المزيد» (no extra network).
      - name: Scroll smoothness on a laptop (the live-animation budget, measured)
        run: node scripts/verify-web-scroll-smooth.mjs
      # Owner 2026-11-04: «changing between filter, smart broker and map … something that always fixes it». A change that
      # makes a tab switch slow never ships: the built app, as a mid-range phone, times every switch against its budget.
      - name: Tab switching speed on a phone (Filter, Smart Broker, Map)
        run: node scripts/verify-web-tab-switch-speed.mjs
      # Owner 2026-11-06: «I never want it to pop up late … let a robot see it». The signed-in welcome line must be on
      # screen when the page is usable and never change, even when today's facts are slow (replayed as a 4 s, failing read).
      - name: Welcome headline never pops in late (signed-in phone, slow facts)
        run: node scripts/verify-web-welcome-never-late.mjs
      # Owner 2026-11-10, after the launch audit found a price showing as «00,000…» and the sign-in card sitting on the
      # search boxes of a laptop: «make sure never ever get this mistake ever. Ever again». The built app at ten laptop
      # sizes, Arabic and English: no side card covers a control, and no price on a card is cut. One live search.
      - name: Nothing cut or covered on a laptop (side cards vs the search form, price lines)
        run: node scripts/verify-web-laptop-nothing-cut-or-covered.mjs

      # Now that this runs unattended on a schedule, a red run has to reach a human. One open P1 per
      # workflow file, self-healing on the next green run. `always()` so a failing run still gets here.
      # 🔧 2026-11-02: only a run of MAIN speaks for production. A pull-request branch's red run raised the
      # same «production is not protected» P1 (15 raises in 24 h, 50 in 7 days, backlog 891) and the next
      # green run of ANY branch resolved it — so the alert flapped and said nothing about main.
      - name: Bridge this run's result to alert_event
        if: always() && github.event_name != 'pull_request'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: >-
          node scripts/ops/raise-workflow-alert.mjs
          --kind journey_live_check_failed
          --workflow web-runtime-smoke.yml
          --status ${{ job.status }}
          --run-url ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
