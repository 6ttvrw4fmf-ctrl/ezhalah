# Production-UI parity (2026-07-24). Deterministic Playwright run against the live production app —
# the reliable replacement for coordinate-based browser checks. Drives Filter mode (Buy / Rent+Monthly
# / type) and AI mode, asserting real Arabic results + correct classification. Nightly + on-demand.
name: UI parity (Playwright)

on:
  schedule:
    # 05:10 UTC — off-peak, and still after audit-invariants (04:40) so the ordering that made
    # 03:00/03:30 useful is preserved. See that file for why peak hours are avoided.
    - cron: '35 5 * * *'   # nightly 05:10 UTC — off-peak, after audit-invariants
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Target URL (defaults to production)'
        required: false
        default: 'https://ezhalah-app.vercel.app'

jobs:
  ui-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright + browser
        run: |
          npm i -D @playwright/test@^1.49
          npx playwright install --with-deps chromium
      - name: Run UI parity tests
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://ezhalah-app.vercel.app' }}
          # This nightly job is the DELIBERATE home of the bounded paid live-model tests.
          # Every other runner leaves them skipped, so paid AI is never incidental.
          EZHALAH_ALLOW_PAID_AI: "1"
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-trace
          path: test-results/
          retention-days: 7

      # ── Failure→alert bridge (2026-09-04, issue #1349) ──────────────────────────────────────────
      # This job runs unattended: a red run notifies nobody, so it has to reach alert_event to reach
      # a human. One open P1 per workflow file (dedup workflow_failed:ui-parity.yml), and the next
      # green run resolves it. `always()` so a failing run still gets here.
      - name: Bridge this run's result to alert_event
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: >-
          node scripts/ops/raise-workflow-alert.mjs
          --kind journey_live_check_failed
          --workflow ui-parity.yml
          --status ${{ job.status }}
          --run-url ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
